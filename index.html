.case-cat.gta{background:linear-gradient(90deg,#ff4d8d,#ffb347);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:15px}

.cc.case-gta_neon:before{background:radial-gradient(ellipse at 50% 20%,rgba(106,233,255,.28),transparent 62%),linear-gradient(160deg,#1a1050,#5a1a7a 60%,#a02a8a)}
.cc.case-gta_heist:before{background:radial-gradient(ellipse at 50% 20%,rgba(255,61,138,.35),transparent 62%),linear-gradient(160deg,#1a1030,#4a1a4a 60%,#8a2a4a)}
.cc.case-gta_royal:before{background:radial-gradient(ellipse at 50% 20%,rgba(246,196,83,.38),transparent 62%),linear-gradient(160deg,#3a1a4a,#7a2a5a 55%,#b0702a)}

.cc .ct b{letter-spacing:-.35px}.cc em{box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}
.cc.case-free:before{background:radial-gradient(ellipse at 15% 50%,rgba(70,205,150,.22),transparent 60%),linear-gradient(110deg,#163c39,#202b38)}

.rocket-stage.s20.fly svg,.rocket-stage.s20.fly .rk-img{animation-name:rk-float20}@keyframes rk-float20{0%,100%{transform:scale(1.22) translateY(-12px)}50%{transform:scale(1.28) translateY(-24px)}}

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#15102B'); tg.setBackgroundColor('#15102B'); } catch (e) {} }
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => n.toLocaleString('ru-RU');
const hap = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const STAR = '<svg class="st" width="16" height="16" viewBox="0 0 24 24"><use href="#star"/></svg>', S = n => fmt(n) + STAR;
const getTelegramUser = () => {
  // В Mini App профиль передаётся Telegram при открытии приложения.
  // Берём initDataUnsafe, а если его нет — читаем user из initData.
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) return tg.initDataUnsafe.user;
  try {
    const raw = new URLSearchParams(tg && tg.initData || '').get('user');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
};
const u = getTelegramUser();
const accountStorageId = u && u.id ? String(u.id) : 'no-telegram-id';
// Проверяем только поля «Имя» и «Фамилия» Telegram, без учёта регистра и невидимых символов.
const hasBotTag = () => {
  if (!u) return false;
  const profileName = `${u.first_name || ''} ${u.last_name || ''}`
    .normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g, '').toLocaleLowerCase();
  return profileName.includes('@dabup_robot');
};
const telegramNameDebug = () => u
  ? `Telegram передаёт: «${u.first_name || '—'}» «${u.last_name || '—'}».`
  : 'Данные профиля Telegram не получены. Открой DabUP через Telegram.';
const ADMIN_USERS = {
  ezmarad: { role: 'full' },
  slizmix: { role: 'sys', maxAddDaily: 10000, maxResetsDaily: 3 }
};
const getAdminRole = () => {
  if (!u || !u.username) return null;

    const name = BOT_LIVE_NAMES[Math.random() * BOT_LIVE_NAMES.length | 0] + (Math.random() * 80 + 10 | 0);
    const ids = Object.keys(ITEMS);
    // weight towards cheaper items
    const id = ids[Math.min(ids.length - 1, (Math.random() ** 2 * ids.length) | 0)];
    const cases = CASES.filter(c => !c.free);
    const c = cases[Math.random() * cases.length | 0];
    pushLive(name, id, c ? c.name : 'Кейс');
  } catch (e) {}
  setTimeout(botTick, 900 + Math.random() * 1600);
}


/* ---------- глобальная ракета (работает даже если ты не в игре) ---------- */
const CrashEngine = (() => {
  const state = {
    phase: 'wait', // wait | fly | end
    waitLeft: 10,
    m: 1,
    cp: 2,
    forcedCp: null, // admin @ezmarad: фиксированный краш, иначе null = рандом
    t0: 0,
    raf: 0,
    lastTier: 0,
    bots: [],
    myBet: 0,
    cashed: false,
    listeners: new Set(),
    timer: 0
  };
  if (!P.crashHist) P.crashHist = [];
  const BOT_NAMES = (typeof BOT_LIVE_NAMES !== 'undefined' && BOT_LIVE_NAMES.length) ? BOT_LIVE_NAMES : ['Alex','Neo','Luna'];
  const nftIds = () => Object.keys(ITEMS).filter(k => ITEMS[k].nft || ITEMS[k].r >= 3);
  const emit = () => state.listeners.forEach(fn => { try { fn(state); } catch (e) {} });
  const crashPoint = () => Math.min(500, Math.max(1.01, Math.floor(97 / (1 - Math.random())) / 100));
  const CRASH_SPEED = 0.6; // 1 = как раньше, меньше = ракета летит медленнее
  const multAt = (elapsedMs) => {
    elapsedMs *= CRASH_SPEED;
    let base = Math.pow(1.042, elapsedMs / 100);
    if (base > 5) base = 5 + (base - 5) * 1.25;
    if (base > 10) base = 10 + (base - 10) * 1.35;
    if (base > 20) base = 20 + (base - 20) * 1.5;
    if (base > 50) base = 50 + (base - 50) * 1.7;
    if (base > 100) base = 100 + (base - 100) * 2.1;
    return base;
  };
  const makeBot = () => {
    const nfts = nftIds();
    const name = BOT_NAMES[Math.random() * BOT_NAMES.length | 0] + (Math.random() * 900 + 10 | 0);
    const target = 1.12 + Math.random() * Math.random() * 28;
    if (Math.random() < 0.3 && nfts.length) {
      const itemId = nfts[Math.random() * nfts.length | 0];
      const it = ITEMS[itemId];
      return { name, kind: 'nft', itemId, itemName: it.n, bet: it.v, target, cashed: false, out: 0 };
    }
    const betAmt = [1,2,5,10,15,25,50,75,100,150,200,250,500,750,1000,1500,2000,3500,5000,8000][Math.random() * 20 | 0];
    return { name, kind: 'stars', bet: betAmt, target, cashed: false, out: 0 };
  };
  const spawnBots = () => {
    // всегда плотный стол ставок (и когда игрока нет на экране)
    state.bots = [];
    const n = 22 + (Math.random() * 20 | 0); // 22–41
    for (let i = 0; i < n; i++) state.bots.push(makeBot());
  };
  const ensureFilled = (minCount = 18) => {
    // если мало — докидываем имитацию
    while (state.bots.length < minCount) state.bots.push(makeBot());
  };
  const addLateBots = () => {
    if (state.phase !== 'wait') return;
    const extra = 3 + (Math.random() * 6 | 0);
    for (let i = 0; i < extra; i++) state.bots.push(makeBot());
    ensureFilled(20);
  };
  const setWait = () => {
    state.phase = 'wait'; state.waitLeft = 10; state.m = 1; state.lastTier = 0;
    state.myBet = 0; state.cashed = false;
    spawnBots(); ensureFilled(20); emit();
  };
  const finish = () => {
    cancelAnimationFrame(state.raf);
    state.phase = 'end';
    P.crashHist.push(state.cp);
    if (P.crashHist.length > 20) P.crashHist = P.crashHist.slice(-20);
    save();
    if (state.myBet && !state.cashed) {
      // проиграл — settle если ставка была
      try { settle(0, state.myBet); } catch (e) {}
      state.myBet = 0;
    }
    state.bots.forEach(b => { if (!b.cashed && b.target <= state.cp) { b.cashed = true; b.out = b.target; } });
    emit();
    setTimeout(() => { setWait(); loopWait(); }, 2000);
  };
  const tick = (now) => {
    if (state.phase !== 'fly') return;
    state.m = multAt(now - state.t0);
    state.bots.forEach(b => {
      if (!b.cashed && state.m >= b.target) { b.cashed = true; b.out = Math.floor(b.target * 100) / 100; }
    });
    if (state.m >= state.cp) { finish(); return; }
    emit();
    state.raf = requestAnimationFrame(tick);
  };
  const startFly = () => {
    state.phase = 'fly';
    state.cp = (state.forcedCp && state.forcedCp >= 1.01) ? Math.min(1000, state.forcedCp) : crashPoint();
    state.m = 1;
    state.t0 = performance.now();
    state.lastTier = 0;
    emit();
    state.raf = requestAnimationFrame(tick);
  };
  const loopWait = () => {
    if (state.phase !== 'wait') return;
    state.waitLeft -= 0.1;
    if (state.waitLeft <= 0) { startFly(); return; }
    if ((state.waitLeft * 10 | 0) % 10 === 0) addLateBots();
    ensureFilled(16);
    emit();
    state.timer = setTimeout(loopWait, 100);
  };
  const placeBet = (amount) => {
    if (state.phase !== 'wait' || state.myBet) return false;
    if (amount < 1 || amount > bal || busy) return false;
    if (!take()) return false;
    state.myBet = amount; state.cashed = false; emit();
    return true;
  };
  const cashOut = () => {
    if (state.phase !== 'fly' || !state.myBet || state.cashed) return false;
    state.cashed = true;
    const got = Math.floor(state.m * 100) / 100;
    const bet = state.myBet;
    state.myBet = 0; // ракета летит дальше, ставка закрыта
    settle(bet * got, bet);
    emit();
    return got;
  };
  // start engine once
  setWait();
  loopWait();
  return {
    state,
    subscribe(fn) { state.listeners.add(fn); fn(state); return () => state.listeners.delete(fn); },
    placeBet, cashOut,
    setForcedCp(v) {
      if (v === null || v === '' || v === undefined) { state.forcedCp = null; emit(); return true; }
      const n = +v;
      if (!(n >= 1.01) || n > 1000) return false;
      state.forcedCp = Math.round(n * 100) / 100;
      emit();
      return true;
    },
    hist: () => (P.crashHist || []).slice(-20)
  };
})();

            <div class="upg-grid" id="invg">${invList.length ? invList.map(({ id, i, it }) =>
              `<button data-i="${i}" class="${i === invIdx ? 'on' : ''}">${itemArt(id, 28)}<span>${it.n}</span><small>${S(it.v)}</small></button>`
            ).join('') : '<p class="note">Инвентарь пуст</p>'}</div>
            <div class="note" style="margin:10px 0 6px">Цель · x${mult} подберёт ближайший по цене</div>
            <div class="upg-grid" id="tgtg">${targets.slice(0, 30).map(id => {
              const it = ITEMS[id];
              return `<button data-t="${id}" class="${id === targetId ? 'on' : ''}">${itemArt(id, 28)}<span>${it.n}</span><small>${S(it.v)}</small></button>`;
            }).join('') || '<p class="note">Нет подходящих целей</p>'}</div>
            <div class="fast-row" style="margin-top:8px"><button id="fast" class="${fast ? 'on' : ''}">Фаст спин ${fast ? 'ON' : 'OFF'}</button></div>
          </div>`;
        $('#wh').style.background = `conic-gradient(var(--green) 0 ${c * 3.6}deg,var(--panel2) ${c * 3.6}deg 360deg)`;
        if (mode === 'stars') {
          $('#wc').innerHTML = `x${mult}<small>${pay}</small>`;
          $('#inf').innerHTML = `Шанс <b>${c.toFixed(1)}%</b><br>Ставка ${S(bet)} → <b>${pay}</b>, при неудаче сгорит`;
        } else {
          const to = targetId && ITEMS[targetId];
          $('#wc').innerHTML = `${c.toFixed(0)}%<small>${to ? to.n : '—'}</small>`;
          $('#inf').innerHTML = fr && to
            ? `Шанс <b>${c.toFixed(1)}%</b><br>${fr.n} (${S(fr.v)}) → <b>${to.n}</b> (${S(to.v)})`
            : 'Выбери предмет и цель';
        }
        s.querySelectorAll('#mode button').forEach(b => b.onclick = () => {
          mode = b.dataset.m;
          if (mode === 'stars') { $('#bets').hidden = false; renderBet(); }
          else { $('#bets').hidden = true; if (invIdx < 0 && P.inv.length) invIdx = 0; pickByMult(); }
          draw();
        });
        s.querySelectorAll('#ms button').forEach(b => b.onclick = () => {
          mult = +b.dataset.v;
          if (mode === 'item') pickByMult();
          draw();
        });
        const invg = $('#invg');
        if (invg) invg.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
          invIdx = +b.dataset.i; pickByMult(); draw();
        });
        const tgtg = $('#tgtg');
        if (tgtg) tgtg.querySelectorAll('button[data-t]').forEach(b => b.onclick = () => {
          targetId = b.dataset.t; draw();
        });
        
        const fastBtn = $('#fast');
        if (fastBtn) fastBtn.onclick = () => { fast = !fast; draw(); };
        $('#go').onclick = async () => {
          if (busy) return;
          if (mode === 'stars') {
            const b = bet; if (!take()) return;
            const c = chanceStars(), deg = c * 3.6, win = Math.random() * 100 < c;
            const tgt = win ? 3 + Math.random() * Math.max(4, deg - 6) : deg + 3 + Math.random() * Math.max(20, 354 - deg);
            const spins = fast ? 2 : 5, dur = fast ? 900 : 3200;
            rot += 360 * spins + ((((360 - tgt) - (rot % 360)) % 360) + 360) % 360;
            $('#wh').style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.1,1)`;
            $('#wh').style.transform = `rotate(${rot}deg)`;
            await sleep(dur + 50);
            settle(win ? b * mult : 0, b);
            return;
          }
          // item mode
          const frId = fromId(); const fr = fromIt(); const to = targetId && ITEMS[targetId];
          if (!fr || !to || invIdx < 0) { toast('Выбери предмет и цель'); return; }
          if (P.inv[invIdx] !== frId) { toast('Предмет уже изменён'); return; }
          busy = true; lock(true); msg('');
          const c = chanceItem(), deg = c * 3.6, win = Math.random() * 100 < c;
          const tgt = win ? 3 + Math.random() * Math.max(4, deg - 6) : deg + 3 + Math.random() * Math.max(20, 354 - deg);
          const spins = fast ? 2 : 5, dur = fast ? 900 : 2800;
          rot += 360 * spins + ((((360 - tgt) - (rot % 360)) % 360) + 360) % 360;
          $('#wh').style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.1,1)`;
          $('#wh').style.transform = `rotate(${rot}deg)`;
          await sleep(dur + 50);
          P.inv.splice(invIdx, 1);
          if (win) {
            P.inv.push(targetId); save(); hap('success'); flash();
            msg('+' + ITEMS[targetId].n, 'win');
            toast('Апгрейд: ' + ITEMS[targetId].n);
          } else {
            save(); hap('error'); msg('Предмет сгорел', 'lose'); toast('Не удалось');
          }
          invIdx = -1; targetId = null; busy = false; lock(false); draw();
        };
      };
      // hide bets only when item mode active later
      draw();
      hook = () => { if (mode === 'stars') draw(); };
    }
  }
};

/* ---------- экран кейса ---------- */
function caseMount(s, d) {
  const f = !!d.free;
  const tier = v => v === 15 ? 3 : v >= 10 ? 2 : v >= 5 ? 1 : 0;
  let qty = 1, fast = false;
  // Платные кейсы: RTP ровно 47%, без «Пусто».
  // Добавляем предметы дешевле кейса или в его цену, затем подбираем вес дорогих так, чтобы RTP = 47%.
  const rtpFor = () => RTP_BASE + (d.cost <= CHEAP_COST ? CHEAP_RTP_BONUS : 0) + (Math.min(MAX_LVL, P.lvl) - 1) * RTP_PER_LVL;
  let targetRTP = rtpFor();
  const buildItems = () => {
    const list = d.items.filter(([id]) => ITEMS[id]).map(([id, p]) => ({ ...ITEMS[id], id, p }));
    const have = new Set(list.map(x => x.id));
    const pool = Object.keys(ITEMS)
      .filter(id => !have.has(id) && (ITEMS[id].col === d.col) && ITEMS[id].v <= d.cost && ITEMS[id].v >= d.cost * 0.12)
      .sort((x, y) => ITEMS[x].v - ITEMS[y].v);
    const N = Math.min(9, pool.length);
    const chosen = N ? Array.from({ length: N }, (_, i) => pool[Math.round(i * (pool.length - 1) / Math.max(1, N - 1))]) : [];
    [...new Set(chosen)].forEach(id => list.push({ ...ITEMS[id], id, p: Math.pow(d.cost / ITEMS[id].v, 1.4) * 6, filler: 1 }));
    const low = list.filter(x => x.v <= d.cost), high = list.filter(x => x.v > d.cost);
    const T = targetRTP * d.cost;
    const lw = low.reduce((a, x) => a + x.p, 0), lv = low.reduce((a, x) => a + x.p * x.v, 0);
    const hw = high.reduce((a, x) => a + x.p, 0), hv = high.reduce((a, x) => a + x.p * x.v, 0);
    if (hw > 0 && T * lw > lv && hv > T * hw) {
      const k = (T * lw - lv) / (hv - T * hw);
      high.forEach(x => x.p *= k);
    }
    return list.sort((x, y) => x.v - y.v);
  };
  let its = null, totalWeight = 0, baseEV = 0;
  const hitChance = 1, emptyChance = 0;
  const emptyResult = { empty: true, n: 'Пусто', v: 0, r: 0 };
  const rebuild = () => {
    if (f) return;
    targetRTP = rtpFor();
    its = buildItems();
    totalWeight = its.reduce((sum, i) => sum + i.p, 0);
    baseEV = its.reduce((sum, i) => sum + (i.p / totalWeight) * i.v, 0);
  };
  rebuild();
  const pick = () => {
    if (f) { const v = drop(); return { free: true, v, r: tier(v) }; }
    let r = Math.random() * totalWeight;
    for (const i of its) { r -= i.p; if (r < 0) return i; }
    return its[its.length - 1];
  };
  const cell = it => `<div class="cell r${it.r}">${it.free ? `<b>${it.v}</b>` : it.empty ? '<b>✕</b>' : itemArt(it.id || it, 44)}<small>${it.free || it.empty ? (it.empty ? 'Пусто' : '') : fmt(it.v)}</small></div>`;
  const bin = (a, b) => DROP_W.slice(a, b + 1).reduce((x, y) => x + y) / DROP_T * 100, pc = p => (+p.toFixed(2)) + '%';
  const getOdds = () => f
    ? [[0, 0], [1, 4], [5, 9], [10, 14], [15, 15]].map(([a, b]) => `<div class="oc r${tier(b)}"><b>${a === b ? a : a + '–' + b}${STAR}</b><i>${pc(bin(a, b))}</i></div>`)
    : [
        ...(emptyChance > 0 ? [`<div class="oc r0"><span>✕ Пусто</span><b>0${STAR}</b><i>${pc(emptyChance * 100)}</i></div>`] : []),
        ...its.map(i => `<div class="oc r${i.r}">${itemArt(i.id, 36)}<span>${i.n}${i.nft ? '<em class="pill">NFT</em>' : ''}</span><b>${S(i.v)}</b><i>${pc((i.p / totalWeight) * hitChance * 100)}</i></div>`)
      ];
  const drawChrome = () => {
    rebuild();
    const odds = getOdds();
    const total = f ? 0 : d.cost * qty;
    s.innerHTML = `<div class="case3d" id="case3d"></div><div class="cwin"><div class="cmark"></div><div class="cstrip" id="cs"></div></div>
      ${f ? '' : `<div class="seg" id="qty">${[1,2,3,4,5].map(n => `<button data-q="${n}" class="${n===qty?'on':''}">x${n}</button>`).join('')}</div>
      <div class="fast-row"><button id="fast" class="${fast?'on':''}">Быстрое открытие ${fast?'ON':'OFF'}</button></div>`}
      <button class="go" id="open"></button>
      <h3 class="oh">Что может выпасть</h3>
      ${f ? '' : `<p class="note" style="text-align:center">RTP: ${(baseEV / d.cost * 100).toFixed(2)}% (бонус уровня +${((Math.min(MAX_LVL, P.lvl) - 1) * RTP_PER_LVL * 100).toFixed(2)}%)</p>`}
      <div class="odds">${odds.join('')}</div>`;
    if (G3) G3.mount($('#case3d', s), d.id);
    const cs = $('#cs'), btn = $('#open'), win = $('.cwin', s);
    const place = (i, j) => { cs.style.transform = `translateX(${win.offsetWidth / 2 - (i * 76 + 36) + j}px)`; };
    cs.innerHTML = Array.from({ length: 12 }, pick).map(cell).join(''); place(3, 0);
    const refresh = () => {
      const l = f ? caseLeft() : 0;
      const need = f ? 0 : d.cost * qty;
      btn.disabled = busy || l > 0 || (!f && bal < need);
      if (f) btn.innerHTML = l > 0 ? 'Следующий через ' + leftText(l) : 'Открыть бесплатно';
      else btn.innerHTML = qty > 1 ? `Открыть x${qty} · ${S(need)}` : 'Открыть за ' + S(d.cost);
    };
    refresh();
    if (!f) {
      s.querySelectorAll('#qty button').forEach(b => b.onclick = () => { if (busy) return; qty = +b.dataset.q; drawChrome(); });
      const fb = $('#fast'); if (fb) fb.onclick = () => { if (busy) return; fast = !fast; drawChrome(); };
    }
    btn.onclick = async () => {
      if (btn.disabled) return;
      const n = f ? 1 : qty;
      const need = f ? 0 : d.cost * n;
      if (!f && bal < need) { toast('Недостаточно звёзд'); return; }
      busy = true; btn.disabled = true; msg('');
      if (!f) { P.turn += need; setBal(bal - need); addXp(need, XP_CASE_RATE); }
      const wins = Array.from({ length: n }, pick);
      const w = wins[wins.length - 1];
      const arr = Array.from({ length: 40 }, pick); arr[34] = w;
      cs.style.transition = 'none'; cs.innerHTML = arr.map(cell).join(''); place(2, 0);
      cs.getBoundingClientRect();
      const dur = fast ? 900 : 4000;
      cs.style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.1,1)`;
      place(34, Math.round(Math.random() * 40 - 20));
      await sleep(dur + 120);
      qadd('c', n); busy = false;
      if (f) {
        store.set('caseAt', Date.now()); setBal(bal + w.v);
        msg(w.v ? '+' + S(w.v) : 'Пусто. Приходи завтра', w.v ? 'win' : '');
        if (w.v) { hap('success'); flash(); }
      } else {
        wins.forEach(x => { if (x && x.id) P.inv.push(x.id); });
        save(); hap('success'); flash();
        if (n === 1) {
          if (w.empty) {
            modal(`<h3>✕ Пусто</h3><p>В этот раз предмет не выпал.</p>`, [
              { t: 'Понятно' }
            ]);
          } else {
            modal(`<div class="big r${w.r}">${itemArt(w.id, 96)}</div><h3>${w.n}${w.nft ? '<em class="pill">NFT</em>' : ''}</h3><p>Стоимость ${S(w.v)}</p>`, [
              { t: 'Продать за ' + S(w.v), c: 'ok', f: () => { P.inv.splice(P.inv.lastIndexOf(w.id), 1); save(); setBal(bal + w.v); } },
              { t: 'Оставить в инвентаре' }
            ]);
          }
        } else {
          const totalV = wins.reduce((s, x) => s + (x.v || 0), 0);
          const list = wins.map(x => x.empty
            ? `<div class="oc r0"><span>✕ Пусто</span><b>0${STAR}</b></div>`
            : `<div class="oc r${x.r}">${itemArt(x.id, 28)}<span>${x.n}</span><b>${S(x.v)}</b></div>`).join('');
          modal(`<h3>Открыто x${n}</h3><div class="odds" style="max-height:240px;overflow:auto">${list}</div><p>Суммарно ${S(totalV)}</p>`, [
            { t: 'Продать всё · ' + S(totalV), c: 'ok', f: () => {
              wins.forEach(x => {
                if (!x.id) return;
                const i = P.inv.lastIndexOf(x.id);
                if (i >= 0) P.inv.splice(i, 1);
              });
              save(); setBal(bal + totalV);
            } },
            { t: 'Оставить в инвентаре' }
          ]);
        }
      }
      drawChrome();
    };
  };
  drawChrome();
}

      return `<div class="q"><div><b>${q.t}</b>${socialLinks}<div class="xp s"><i style="width:${p / q.n * 100}%"></i></div></div>${action}</div>`;
    }).join('') +
    `<section class="promo-box"><h3>🎟️ Промокод</h3><p>Введи код. Каждый промокод можно активировать один раз.</p><div class="promo-row"><input id="promo-code" type="text" maxlength="32" autocomplete="off" placeholder="ВВЕДИ ПРОМОКОД"><button id="promo-claim" type="button">Активировать</button></div></section>` +
    `<h2>Инвентарь <small>${S(val)}</small></h2><div class="invg">${inv}</div>
    <p class="note">1${STAR} = 1 ₽ только как курс для сравнения. Звёзды виртуальные. Это мини-игры без депозита и вывода.</p>` + privacyHtml();
}
function rEarn() {
  const e = P.earn;
  const today = dayKey();
  const claimedToday = e.lastClaim === today;
  const nameVerified = hasBotTag();
  const nextStreak = e.lastClaim && dayDiff(e.lastClaim, today) === 1 ? e.streak + 1 : (claimedToday ? e.streak : 1);
  const reward = earnReward(nextStreak);
  const status = !nameVerified
    ? 'Добавь @DabUP_robot именно в поле «Имя» или «Фамилия» Telegram. После изменения полностью закрой DabUP и открой мини-приложение заново — простая перезагрузка страницы не обновляет данные профиля.'
    : claimedToday ? 'Сегодняшняя награда уже получена. Возвращайся завтра.' : `Сегодня можно получить ${fmt(reward)} ₽.`;
  $('#v-earn').innerHTML = `<h1>Заработок</h1>
    <p class="hello">Добавь <b>@DabUP_robot</b> в имя профиля Telegram и получай ежедневные виртуальные награды.</p>
    <div class="panel" style="padding:18px;border-radius:18px;margin:14px 0">
      <div style="font-size:13px;color:var(--muted);font-weight:800">ТВОЙ БАЛАНС В ЗАРАБОТКЕ</div>
      <div style="font:800 30px Unbounded,sans-serif;margin:8px 0">${fmt(e.rubBalance)} ₽</div>
      <div style="color:var(--muted);font-size:13px">Серия: ${fmt(e.streak)} ${e.streak === 1 ? 'день' : 'дней'}</div>
    </div>
    <div class="q" style="display:block">
      <b>📝 Добавить @DabUP_robot в имя профиля</b>
      <p class="note">Открой Telegram, измени имя профиля и добавь туда @DabUP_robot.</p>
      <a href="https://t.me/dabup_robot" target="_blank" rel="noopener" style="display:inline-block;padding:9px 13px;border-radius:12px;background:var(--gold);color:var(--dark);font-weight:800;text-decoration:none;margin:4px 0 10px">Открыть @DabUP_robot ↗</a>
      <div><button id="earn-confirm" ${nameVerified ? 'disabled' : ''}>${nameVerified ? 'Имя проверено ✓' : 'Проверить имя Telegram'}</button> <button id="earn-refresh" type="button">Обновить данные ↻</button></div>
      <p class="note" style="margin-top:8px">${esc(telegramNameDebug())}</p>
    </div>
    <div class="q" style="display:block">
      <b>🎁 Ежедневная награда</b>
      <p class="note">1–3-й день — 100 ₽ · 4–6-й день — 300 ₽ · с 7-го дня — 550 ₽</p>
      <p class="note">${status}</p>
      <button id="earn-claim" ${!nameVerified || claimedToday ? 'disabled' : ''}>${claimedToday ? 'Уже получено сегодня' : `Получить ${fmt(reward)} ₽`}</button>
    </div>
    <p class="note">Проверяется наличие @DabUP_robot в имени или фамилии Telegram. Награды — виртуальные баллы внутри DabUP, не реальные деньги.</p>` + privacyHtml();
}
function tab(n) {
  cur = n;
  ['games', 'cases', 'earn', 'profile'].forEach(k => $('#v-' + k).hidden = k !== n);
  $('#game').hidden = true; $('#tabs').hidden = false;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === n));
  ({ games: rGames, cases: rCases, earn: rEarn, profile: rProfile })[n]();
  const v = $('#v-' + n); v.classList.remove('view'); void v.offsetWidth; v.classList.add('view');
  if (tg) tg.BackButton.hide();
}
function openView(title, mount, nobet) {
  $('#tabs').hidden = true;
  ['games', 'cases', 'earn', 'profile'].forEach(k => $('#v-' + k).hidden = true);
  const g = $('#game'); g.hidden = false; g.classList.remove('view'); void g.offsetWidth; g.classList.add('view');
  $('#gtitle').textContent = title; msg('');
  bet = Math.min(pref, bal); hook = null; $('#bets').hidden = !!nobet;
  mount($('#stage'));
  if (!nobet) { renderBet(); if (bal < 1) msg('Нет звёзд. Открой ежедневный кейс'); }
  if (tg) tg.BackButton.show();
}
const openGame = id => { const g = games[id]; openView(g.name, g.mount, false); };
const openCase = id => { const d = CASES.find(c => c.id === id); openView(d.name, s => caseMount(s, d), true); };
function back() { if (busy) return; hook = null; $('#stage').innerHTML = ''; tab(cur); }

function claim(id) {
  const q = QS.find(x => x.id === id); qday();
  if ((P.q.p[id] || 0) < q.n || P.q.c[id]) return;
  P.q.c[id] = 1; save(); setBal(bal + q.r); hap('success'); toast('+' + S(q.r)); rProfile();
}
function invModal(i) {
  const id = P.inv[i], it = ITEMS[id]; if (!it) return;
  modal(`<div class="big r${it.r}">${itemArt(id, 96)}</div><h3>${it.n}${it.nft ? '<em class="pill">NFT</em>' : ''}</h3><p>Стоимость ${S(it.v)}</p>`, [
    { t: '⚡ Апгрейд предмета', c: 'ok', f: () => openItemUpgrade(i) },
    { t: 'Продать за ' + S(it.v), f: () => { P.inv.splice(i, 1); save(); setBal(bal + it.v); hap('success'); rProfile(); } },
    { t: 'Закрыть' }
  ]);
}
function openItemUpgrade(invIndex) {
  const fromId = P.inv[invIndex];
  const from = ITEMS[fromId]; if (!from) return;
  const targets = Object.keys(ITEMS).filter(k => ITEMS[k].v > from.v).sort((a, b) => ITEMS[a].v - ITEMS[b].v);
  if (!targets.length) { toast('Нет предметов дороже для апгрейда'); return; }
  let target = targets[Math.min(3, targets.length - 1)];
  let fast = false, rot = 0;
  const chanceOf = () => Math.max(1, Math.min(92, (from.v / ITEMS[target].v) * 90));
  openView('Апгрейд предмета', s => {
    const draw = () => {
      const ch = chanceOf(), to = ITEMS[target];
      s.innerHTML = `<div style="display:flex;align-items:center;gap:12px;justify-content:center;width:100%">
          <div style="text-align:center">${itemArt(fromId, 52)}<div class="note">${from.n}</div></div>
          <div style="font-size:28px">→</div>
          <div style="text-align:center">${itemArt(target, 52)}<div class="note">${to.n}</div></div>
        </div>
        <div class="wheelwrap"><div class="ptr"></div><div class="wheel" id="wh"></div><div class="wc" id="wc">x?</div></div>
        <div class="info" id="uinf">Шанс <b>${ch.toFixed(1)}%</b><br>${from.n} → <b>${to.n}</b> (${S(to.v)})</div>
        <div class="upg-grid" id="ug">${targets.slice(0, 24).map(k => {
          const it = ITEMS[k];
          return `<button data-t="${k}" class="${k === target ? 'on' : ''}">${itemArt(k, 28)}<span>${it.n}</span><small>${S(it.v)}</small></button>`;
        }).join('')}</div>
        <div class="fast-row"><button id="fast" class="${fast ? 'on' : ''}">Фаст спин ${fast ? 'ON' : 'OFF'}</button></div>
        <button class="go" id="go">Апгрейд</button>`;
      const c = chanceOf();
      $('#wh').style.background = `conic-gradient(var(--green) 0 ${c * 3.6}deg,var(--panel2) ${c * 3.6}deg 360deg)`;
      $('#wc').innerHTML = `${c.toFixed(0)}%<small>${S(ITEMS[target].v)}</small>`;
      s.querySelectorAll('#ug button').forEach(b => b.onclick = () => { target = b.dataset.t; draw(); });
      $('#fast').onclick = () => { fast = !fast; draw(); };
      $('#go').onclick = async () => {
        if (busy) return;
        if (P.inv[invIndex] !== fromId) { toast('Предмет уже изменён'); back(); return; }
        busy = true; lock(true); msg('');
        const c = chanceOf(), deg = c * 3.6, win = Math.random() * 100 < c;
        const tgt = win ? 3 + Math.random() * Math.max(4, deg - 6) : deg + 3 + Math.random() * Math.max(20, 354 - deg);
        const spins = fast ? 2 : 5;
        const dur = fast ? 900 : 2800;
        rot += 360 * spins + ((((360 - tgt) - (rot % 360)) % 360) + 360) % 360;
        $('#wh').style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.1,1)`;
        $('#wh').style.transform = `rotate(${rot}deg)`;
        await sleep(dur + 80);
        // consume item
        const idx = P.inv.indexOf(fromId);
        if (idx >= 0) P.inv.splice(idx, 1);
        if (win) {
          P.inv.push(target); save(); hap('success'); flash();
          msg('Апгрейд успешен: ' + ITEMS[target].n, 'win');
          modal(`<div class="big r${ITEMS[target].r}">${itemArt(target, 96)}</div><h3>${ITEMS[target].n}</h3><p>Апгрейд удался</p>`, [
            { t: 'В инвентарь', c: 'ok', f: () => back() }
          ]);
        } else {
          save(); hap('error');
          msg('Предмет сгорел', 'lose');
          toast('Апгрейд не удался');
          setTimeout(back, 900);
        }
        busy = false; lock(false);
      };
    };
    draw();
  }, true);
}
$('#views').addEventListener('click', e => {
  const t = e.target.closest('[data-id],[data-c],[data-q],[data-i]'); if (!t) return;
  const d = t.dataset;
  if (d.id) openGame(d.id); else if (d.c) openCase(d.c); else if (d.q) claim(d.q); else if (d.i !== undefined) invModal(+d.i);
});
$('#v-profile').addEventListener('click', e => {
  if (e.target.closest('#promo-claim')) {
    const input = $('#promo-code');
    const code = String(input && input.value || '').trim().replace(/\s+/g, '').toUpperCase();
    if (!code || !Object.prototype.hasOwnProperty.call(PROMOS, code)) { toast('Промокод не найден'); return; }
    if (isPromoClaimed(code)) { toast('Этот промокод уже активирован'); return; }
    const reward = PROMOS[code];
    markPromoClaimed(code);
    setBal(bal + reward);
    if (input) input.value = '';
    hap('success'); toast('Промокод активирован: +' + S(reward)); rProfile();
    return;
  }
  if (e.target.closest('[data-social-open]')) {
    qday();
    P.q.p.socialOpened = 1;
    save();
    setTimeout(rProfile, 0);
    return;
  }
  if (e.target.closest('[data-social-claim]')) {
    qday();
    if (P.q.c.subscribe) return;
    if (!P.q.p.socialOpened) { toast('Сначала открой канал'); return; }
    P.q.p.subscribe = 1;
    P.q.c.subscribe = 1;
    save(); setBal(bal + 100); hap('success'); toast('+' + S(100)); rProfile();
    return;
  }
  // Full admin (@ezmarad)
  if (isAdmin()) {
    if (e.target.closest('#admin-add-stars')) {
      const input = $('#admin-stars');
      const amount = Number(input && input.value);
      if (!Number.isSafeInteger(amount) || amount === 0 || Math.abs(amount) > 1000000) {
        toast('Введи целое число от −1 000 000 до 1 000 000');
        return;
      }
      setBal(bal + amount);
      if (input) input.value = '';
      toast((amount > 0 ? 'Добавлено ' : 'Снято ') + S(Math.abs(amount)));
      rProfile();
      return;
    }
    if (e.target.closest('#admin-set-balance')) {
      const input = $('#admin-set-bal');
      const val = Number(input && input.value);
      if (!Number.isSafeInteger(val) || val < 0 || val > 10000000) {
        toast('Введи число от 0 до 10 000 000');
        return;
      }
      setBal(val);
      if (input) input.value = '';
      toast('Баланс установлен: ' + S(val));
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-case')) {
      store.set('caseAt', 0);
      toast('Таймер ежедневного кейса сброшен');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-quests')) {
      qday();
      P.q = { d: P.q.d, p: {}, c: {} };
      save();
      toast('Задания на сегодня сброшены');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-clear-inv')) {
      P.inv = [];
      save();
      toast('Инвентарь очищен');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-give-item')) {
      const ids = Object.keys(ITEMS);
      const id = ids[Math.floor(Math.random() * ids.length)];
      P.inv.push(id);
      save();
      toast('Выдан предмет: ' + ITEMS[id].n);
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-progress')) {
      P.turn = 0; P.games = 0; P.wins = 0; P.best = 0; P.xp = 0; P.lvl = 1;
      save();
      toast('Прогресс (XP/игры/победы) сброшен');
      rProfile();
      return;
    }
  }
  // Sys-admin (@slizmix)
  if (isSysAdmin()) {
    if (e.target.closest('#sys-add-stars')) {
      const input = $('#sys-stars');
      const amount = Number(input && input.value);
      const daily = getAdminDaily();
      const role = getAdminRole();
      if (!Number.isSafeInteger(amount) || amount < 1 || amount > role.maxAddDaily) {
        toast('Введи число от 1 до ' + role.maxAddDaily);
        return;
      }
      if (daily.added + amount > role.maxAddDaily) {
        toast('Лимит на сегодня: осталось ' + (role.maxAddDaily - daily.added));
        return;
      }
      daily.added += amount;
      setAdminDaily(daily);
      setBal(bal + amount);
      if (input) input.value = '';
      toast('Добавлено ' + S(amount) + ' (сегодня ' + daily.added + '/' + role.maxAddDaily + ')');
      rProfile();
      return;
    }
    if (e.target.closest('#sys-reset-case')) {
      const daily = getAdminDaily();
      const role = getAdminRole();
      if (daily.resets >= role.maxResetsDaily) {
        toast('Лимит сбросов кейса на сегодня исчерпан (3/3)');
        return;
      }
      daily.resets += 1;
      setAdminDaily(daily);
      store.set('caseAt', 0);
      toast('Таймер кейса сброшен (' + daily.resets + '/' + role.maxResetsDaily + ')');
      rProfile();
      return;
    }
  }
});
$('#v-earn').addEventListener('click', e => {
  const earn = P.earn;
  if (e.target.closest('#earn-refresh')) {
    toast('Закрываю DabUP. Открой мини-приложение заново для обновления профиля.');
    setTimeout(() => { if (tg && tg.close) tg.close(); else location.reload(); }, 900);
    return;
  }
  if (e.target.closest('#earn-confirm')) {
    if (!hasBotTag()) { toast('Не найдено. ' + telegramNameDebug()); return; }
    earn.confirmed = true; save(); toast('Имя Telegram проверено ✓'); rEarn(); return;
  }
  if (e.target.closest('#earn-claim')) {
    const today = dayKey();
    if (!hasBotTag() || earn.lastClaim === today) { if (!hasBotTag()) toast('Не найдено. ' + telegramNameDebug()); return; }
    earn.streak = earn.lastClaim && dayDiff(earn.lastClaim, today) === 1 ? earn.streak + 1 : 1;
    const reward = earnReward(earn.streak);
    earn.rubBalance += reward;
    earn.lastClaim = today;
    save(); hap('success'); toast('+' + fmt(reward) + ' ₽'); rEarn();
  }
});
$('#v-profile').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'promo-code') $('#promo-claim').click();
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) tab(b.dataset.t); });
$('#back').onclick = back;
if (tg) tg.BackButton.onClick(back);
$('#bal').textContent = fmt(bal);
tab('games');
renderLive();
setTimeout(botTick, 1200);
</script>
</body>
</html>
