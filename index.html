<style>

/* DabUP case artwork */
.cc{position:relative;isolation:isolate;overflow:hidden;border:1px solid rgba(255,255,255,.09);min-height:94px;box-shadow:0 9px 24px rgba(0,0,0,.16)}
.cc:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.95;pointer-events:none}
.cc:after{content:"";position:absolute;right:-24px;top:-44px;width:130px;height:130px;border:1px solid rgba(255,255,255,.12);border-radius:50%;box-shadow:0 0 0 14px rgba(255,255,255,.025),0 0 0 29px rgba(255,255,255,.02);pointer-events:none;z-index:-1}
.cc .ce{width:66px;height:66px;font-size:40px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1)}
.cc .ct b{letter-spacing:-.35px}.cc em{box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}
.cc.case-free:before{background:radial-gradient(ellipse at 15% 50%,rgba(70,205,150,.22),transparent 60%),linear-gradient(110deg,#163c39,#202b38)}
.cc.case-bear:before,.cc.case-lucky:before,.cc.case-prem:before,.cc.case-elite:before{background:radial-gradient(ellipse at 15% 50%,rgba(255,190,90,.18),transparent 60%),linear-gradient(110deg,#3a2a55,#241e3a)}
.cc.case-pocket:before,.cc.case-spare:before,.cc.case-starter:before{background:radial-gradient(ellipse at 15% 50%,rgba(160,170,200,.2),transparent 60%),linear-gradient(110deg,#2a3048,#1e2438)}
.cc.case-neon:before,.cc.case-pulse:before{background:radial-gradient(ellipse at 15% 50%,rgba(180,80,255,.28),transparent 55%),linear-gradient(110deg,#3a1a5a,#1e1538)}
.cc.case-midnight:before,.cc.case-shadow:before{background:radial-gradient(ellipse at 15% 50%,rgba(60,80,180,.3),transparent 55%),linear-gradient(110deg,#1a1e3a,#121528)}
.cc.case-black:before,.cc.case-vault:before{background:radial-gradient(ellipse at 15% 50%,rgba(40,40,50,.4),transparent 55%),linear-gradient(110deg,#1a1a22,#0e0e14)}
.cc.case-legend:before,.cc.case-absolute:before{background:radial-gradient(ellipse at 15% 50%,rgba(246,196,83,.28),transparent 55%),linear-gradient(110deg,#3a2a12,#1e1810)}
.cc.case-neon,.cc.case-pulse{border-color:rgba(180,100,255,.35);box-shadow:0 9px 26px rgba(120,40,200,.15)}
.cc.case-midnight,.cc.case-shadow{border-color:rgba(90,110,220,.3);box-shadow:0 9px 26px rgba(40,50,140,.14)}
.cc.case-black,.cc.case-vault{border-color:rgba(80,80,90,.4);box-shadow:0 9px 26px rgba(0,0,0,.25)}
.cc.case-legend,.cc.case-absolute{border-color:rgba(246,196,83,.4);box-shadow:0 9px 28px rgba(180,120,20,.18)}
.cc.case-free .ce{background:linear-gradient(145deg,#277a61,#294c58)}
.cc.case-pocket .ce,.cc.case-spare .ce,.cc.case-starter .ce{background:linear-gradient(145deg,#4a5578,#2e3548)}
.cc.case-bear .ce,.cc.case-lucky .ce,.cc.case-prem .ce,.cc.case-elite .ce{background:linear-gradient(145deg,#6a4ab0,#3d2a6e)}
.cc.case-neon .ce,.cc.case-pulse .ce{background:linear-gradient(145deg,#8b3dff,#4a1a8a)}
.cc.case-midnight .ce,.cc.case-shadow .ce{background:linear-gradient(145deg,#3a4a9a,#1e2858)}
.cc.case-black .ce,.cc.case-vault .ce{background:linear-gradient(145deg,#2a2a32,#141418)}
.cc.case-legend .ce,.cc.case-absolute .ce{background:linear-gradient(145deg,#c9a227,#6a4a10)}
.case-cat{font:800 13px Unbounded,sans-serif;color:var(--muted);margin:18px 0 10px;letter-spacing:.02em;text-transform:uppercase}
.case-cat:first-of-type{margin-top:6px}
.ce{display:grid;place-items:center;overflow:hidden}
.ce .ci{width:50px;height:50px;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
.ce .ci-fallback{font-size:40px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.live-wrap{display:flex;align-items:center;gap:8px;margin:0 0 10px;padding:8px 10px;border-radius:14px;background:var(--panel);overflow:hidden}
.live-badge{flex:none;background:var(--red);color:#fff;font-weight:800;font-size:11px;padding:4px 8px;border-radius:8px;letter-spacing:.04em}
.live-track{flex:1;overflow:hidden;white-space:nowrap;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.live-track-inner{display:inline-flex;gap:14px;animation:live-scroll 14s linear infinite}
.live-item{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;color:var(--muted)}
.live-item b{color:var(--ink)}
.live-item .ii{width:18px;height:18px}
@keyframes live-scroll{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.crash-hist{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:8px;max-height:64px;overflow:hidden}
.crash-hist span{font:800 12px Unbounded,sans-serif;padding:4px 8px;border-radius:8px;background:var(--panel2)}
.crash-hist .h-low{color:var(--muted)}.crash-hist .h-mid{color:var(--gold)}.crash-hist .h-hi{color:var(--green)}.crash-hist .h-boom{color:var(--red)}
.crash-bots{width:100%;max-height:220px;overflow-x:hidden;overflow-y:auto;margin-top:8px;display:flex;flex-direction:column;flex-wrap:nowrap;gap:6px;-webkit-overflow-scrolling:touch}
.crash-bots div{flex:0 0 auto;width:100%;display:flex;flex-direction:row;justify-content:space-between;align-items:center;gap:8px;font-size:12px;font-weight:700;color:var(--muted);padding:8px 10px;background:var(--panel2);border-radius:10px}
.crash-bots .ii{width:18px;height:18px;flex:none}
.rocket-stage{position:relative;width:120px;height:120px;display:grid;place-items:center;margin:4px auto}
.rocket-stage svg,.rocket-stage .rk-img{width:100px;height:100px;object-fit:contain;transition:transform .25s ease-out,filter .25s;display:block}
.rocket-stage .rk-boom{font-size:64px;line-height:1}
.rocket-stage.fly svg,.rocket-stage.fly .rk-img{animation:rk-float .6s ease-in-out infinite}
.rocket-stage.s5 svg,.rocket-stage.s5 .rk-img{transform:scale(1.08) translateY(-6px);filter:drop-shadow(0 0 10px #F6C453)}
.rocket-stage.s10 svg,.rocket-stage.s10 .rk-img{transform:scale(1.14) translateY(-10px);filter:drop-shadow(0 0 14px #FF4D8D);animation-duration:.45s}
.rocket-stage.s20 svg,.rocket-stage.s20 .rk-img{transform:scale(1.22) translateY(-16px);filter:drop-shadow(0 0 18px #8B6CFF);animation-duration:.32s}
.rocket-stage.s50 svg,.rocket-stage.s50 .rk-img{transform:scale(1.32) translateY(-22px);filter:drop-shadow(0 0 22px #2EC4B6);animation-duration:.22s}
.rocket-stage.s100 svg,.rocket-stage.s100 .rk-img{transform:scale(1.42) translateY(-28px);filter:drop-shadow(0 0 28px #FF4D8D);animation-duration:.15s}
.rocket-stage.boom svg,.rocket-stage.boom .rk-img{animation:none;transform:scale(1.2);filter:grayscale(.2)}
@keyframes rk-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.rocket-stage.s5.fly svg,.rocket-stage.s5.fly .rk-img{animation-name:rk-float5}@keyframes rk-float5{0%,100%{transform:scale(1.08) translateY(-4px)}50%{transform:scale(1.1) translateY(-12px)}}
.rocket-stage.s10.fly svg,.rocket-stage.s10.fly .rk-img{animation-name:rk-float10}@keyframes rk-float10{0%,100%{transform:scale(1.14) translateY(-8px)}50%{transform:scale(1.18) translateY(-18px)}}
.rocket-stage.s20.fly svg,.rocket-stage.s20.fly .rk-img{animation-name:rk-float20}@keyframes rk-float20{0%,100%{transform:scale(1.22) translateY(-12px)}50%{transform:scale(1.28) translateY(-24px)}}
.rocket-stage.s50.fly svg,.rocket-stage.s50.fly .rk-img{animation-name:rk-float50}@keyframes rk-float50{0%,100%{transform:scale(1.32) translateY(-16px)}50%{transform:scale(1.4) translateY(-30px)}}
.rocket-stage.s100.fly svg,.rocket-stage.s100.fly .rk-img{animation-name:rk-float100}@keyframes rk-float100{0%,100%{transform:scale(1.42) translateY(-20px)}50%{transform:scale(1.55) translateY(-36px)}}
.crash-bots{max-height:none}

.rk-fx{position:absolute;inset:0;overflow:hidden;pointer-events:none;border-radius:18px}
.rk-star{position:absolute;width:3px;height:3px;background:#fff;border-radius:50%;opacity:.8;animation:rk-star-fall linear infinite}
.rk-cloud{position:absolute;width:28px;height:12px;background:rgba(255,255,255,.12);border-radius:20px;filter:blur(1px);animation:rk-cloud-fall linear infinite}
.rk-wind{position:absolute;width:2px;height:18px;background:linear-gradient(180deg,transparent,rgba(180,210,255,.55),transparent);border-radius:2px;animation:rk-wind-fall linear infinite}
@keyframes rk-star-fall{from{transform:translateY(-10px);opacity:0}20%{opacity:.9}to{transform:translateY(130px);opacity:0}}
@keyframes rk-cloud-fall{from{transform:translateY(-20px) scale(1);opacity:0}30%{opacity:.35}to{transform:translateY(140px) scale(.7);opacity:0}}
@keyframes rk-wind-fall{from{transform:translateY(-20px);opacity:0}40%{opacity:.7}to{transform:translateY(140px);opacity:0}}
.rocket-stage{position:relative}
.privacy{margin-top:22px;padding:14px;border-radius:16px;background:var(--panel);color:var(--muted);font-size:11.5px;line-height:1.5}
.privacy b{color:var(--ink);display:block;margin-bottom:6px;font-size:12.5px}


.crash-bots b{color:var(--ink)}
.upg-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;width:100%;max-height:220px;overflow:auto}
.upg-grid button{padding:10px 6px;border-radius:14px;background:var(--panel2);display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;font-weight:700}
.upg-grid button.on{outline:2px solid var(--gold);background:var(--panel)}
.upg-grid .ii{width:32px;height:32px}
.fast-row{display:flex;gap:8px;width:100%;margin-top:4px}
.fast-row button{flex:1;padding:10px;border-radius:12px;background:var(--panel2);font-weight:800}
.fast-row button.on{background:var(--ink);color:var(--dark)}

.ii{display:block;flex:none;filter:drop-shadow(0 2px 4px rgba(0,0,0,.3))}
.ii-emoji{font-size:1.6em;line-height:1;filter:drop-shadow(0 2px 3px rgba(0,0,0,.25))}
.cell .ii,.oc .ii{width:36px;height:36px}
.inv .ii{width:34px;height:34px}
.big .ii{width:96px;height:96px;margin:0 auto;filter:drop-shadow(0 6px 16px rgba(0,0,0,.35))}
.cell,.oc,.inv{gap:4px}
.case-hero{padding:18px 16px 14px;border-radius:20px;margin:0 0 14px;background:linear-gradient(130deg,#29204a,#171b36);border:1px solid rgba(255,255,255,.09);position:relative;overflow:hidden}
.case-hero:after{content:"✦";position:absolute;right:15px;top:-14px;font-size:90px;color:rgba(255,255,255,.07);transform:rotate(15deg)}
.case-hero b{font:800 17px Unbounded,sans-serif;display:block;margin-bottom:6px}.case-hero span{color:var(--muted);font-size:12px}
.cwin{border:1px solid rgba(255,255,255,.1);box-shadow:0 12px 32px rgba(0,0,0,.22)}

.promo-box{margin:16px 0;padding:16px;border-radius:18px;background:linear-gradient(135deg,#282047,#171b35);border:1px solid rgba(180,150,255,.2)}
.promo-box h3{margin:0 0 6px;font:800 15px Unbounded,sans-serif}.promo-box p{margin:0 0 12px;color:var(--muted);font-size:12px}
.promo-row{display:flex;gap:8px}.promo-row input{min-width:0;flex:1;padding:12px;border-radius:12px;border:1px solid rgba(255,255,255,.12);background:rgba(0,0,0,.2);color:inherit;font:700 14px Manrope,sans-serif;text-transform:uppercase}.promo-row button{padding:0 14px;border:0;border-radius:12px;background:var(--gold);color:#211708;font-weight:800}
</style>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#F29A12"/></linearGradient></defs><symbol id="star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.2L12 17.9l-6.4 3.6L7 14.3 1.7 9.3l7.2-.9z" fill="url(#sg)" stroke="#C47F08" stroke-width="1" stroke-linejoin="round"/></symbol></svg>

<header class="top">
  <div class="logo">DabUP</div>
  <div class="bal"><svg class="st" width="22" height="22"><use href="#star"/></svg><b id="bal">0</b></div>
</header>
<div class="live-wrap" id="live-wrap">
  <span class="live-badge">LIVE</span>
  <div class="live-track" id="live-track"></div>
</div>

<main id="views">
  <section class="view" id="v-games"></section>
  <section class="view" id="v-cases" hidden></section>
  <section class="view" id="v-earn" hidden></section>
  <section class="view" id="v-profile" hidden></section>
</main>

<section id="game" class="view" hidden>
  <div class="gbar"><button id="back">‹ Назад</button><h2 id="gtitle"></h2></div>
  <div class="panel">
    <div id="stage"></div>
    <div class="msg" id="msg"></div>
  </div>

</section>

<nav class="tabs" id="tabs">
  <button data-t="games" class="on">🎮<span>Игры</span></button>
  <button data-t="cases">📦<span>Кейсы</span></button>
  <button data-t="earn">💸<span>Заработок</span></button>

</nav>
<div id="modal"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#15102B'); tg.setBackgroundColor('#15102B'); } catch (e) {} }
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => n.toLocaleString('ru-RU');
const hap = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const STAR = '<svg class="st" width="16" height="16" viewBox="0 0 24 24"><use href="#star"/></svg>', S = n => fmt(n) + STAR;
const getTelegramUser = () => {
  // В Mini App профиль передаётся Telegram при открытии приложения.
  // Берём initDataUnsafe, а если его нет — читаем user из initData.
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) return tg.initDataUnsafe.user;
  try {
    const raw = new URLSearchParams(tg && tg.initData || '').get('user');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
};
const u = getTelegramUser();
const accountStorageId = u && u.id ? String(u.id) : 'no-telegram-id';
// Проверяем только поля «Имя» и «Фамилия» Telegram, без учёта регистра и невидимых символов.
const hasBotTag = () => {
  if (!u) return false;
  const profileName = `${u.first_name || ''} ${u.last_name || ''}`
    .normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g, '').toLocaleLowerCase();
  return profileName.includes('@dabup_robot');
};
const telegramNameDebug = () => u
  ? `Telegram передаёт: «${u.first_name || '—'}» «${u.last_name || '—'}».`
  : 'Данные профиля Telegram не получены. Открой DabUP через Telegram.';
const ADMIN_USERS = {
  ezmarad: { role: 'full' },
  slizmix: { role: 'sys', maxAddDaily: 10000, maxResetsDaily: 3 }
};
const getAdminRole = () => {
  if (!u || !u.username) return null;
  const key = String(u.username).toLowerCase();
  return ADMIN_USERS[key] || null;
};
const isAdmin = () => getAdminRole()?.role === 'full';
const isSysAdmin = () => getAdminRole()?.role === 'sys';
const isAnyAdmin = () => !!getAdminRole();
// Промокоды: без обязательного Telegram. КД ~200 лет.
// Пишем и в ключ аккаунта, и в общий — чтобы на Android не слетало.
const PROMOS = Object.freeze({ UPDATED: 1234, OBNOVA: 2000, 'DABUP-5BEBV2': 1250, 'DABUP-5KMMNX': 1250, 'DABUP-6HPKQ8': 1250, 'DABUP-A3Z6T5': 1250, 'DABUP-DJAGSL': 1250, 'DABUP-HX5MC6': 1250, 'DABUP-JGMYCP': 1250, 'DABUP-KDV2XK': 1250, 'DABUP-KQJ2JU': 1250, 'DABUP-KZDGEP': 1250, 'DABUP-LJFMQX': 1250, 'DABUP-M69G86': 1250, 'DABUP-NKYPDB': 1250, 'DABUP-P29VMA': 1250, 'DABUP-Q8G7LU': 1250, 'DABUP-RYUPZE': 1250, 'DABUP-SZNDP9': 1250, 'DABUP-V5BH4T': 1250, 'DABUP-VK2672': 1250, 'DABUP-VTG2Z7': 1250 });
const PROMO_CD_MS = 200 * 365.25 * 24 * 3600 * 1000; // ~200 лет
const promoStorageKey = 'dabup:promo:claimed:' + accountStorageId;
const promoGlobalKey = 'dabup:promo:claimed:global';
function loadPromoMap(key) {
  let m = store.get(key, {});
  if (Array.isArray(m)) {
    const map = {};
    m.forEach(c => { map[c] = Date.now(); });
    m = map;
    store.set(key, m);
  }
  return m && typeof m === 'object' ? m : {};
}
let claimedPromos = { ...loadPromoMap(promoGlobalKey), ...loadPromoMap(promoStorageKey) };
function isPromoClaimed(code) {
  const ts = claimedPromos[code] || loadPromoMap(promoStorageKey)[code] || loadPromoMap(promoGlobalKey)[code];
  if (!ts) return false;
  return (Date.now() - ts) < PROMO_CD_MS;
}
function markPromoClaimed(code) {
  const now = Date.now();
  claimedPromos = { ...claimedPromos, [code]: now };
  store.set(promoStorageKey, { ...loadPromoMap(promoStorageKey), [code]: now });
  store.set(promoGlobalKey, { ...loadPromoMap(promoGlobalKey), [code]: now });
}
// Дневные лимиты для sys-admin (dayKey определён ниже, используем локальный расчёт)
const adminDailyKey = 'dabup:admin:daily:' + accountStorageId;
function getAdminDaily() {
  const d0 = new Date();
  const today = [d0.getFullYear(), String(d0.getMonth()+1).padStart(2,'0'), String(d0.getDate()).padStart(2,'0')].join('-');
  let d = store.get(adminDailyKey, { date: today, added: 0, resets: 0 });
  if (d.date !== today) d = { date: today, added: 0, resets: 0 };
  return d;
}
function setAdminDaily(d) { store.set(adminDailyKey, d); }


/* ---------- настройки ---------- */
const START_BALANCE = 0;
const CASE_COOLDOWN = 24 * 3600 * 1000;
// вес выпадения 0..15 звёзд из бесплатного кейса; 15 — около 0.1%
const DROP_W = [32, 24, 16, 10, 6, 4, 3, 2, 1.2, 0.8, 0.5, 0.3, 0.15, 0.08, 0.04, 0.02];
const DROP_T = DROP_W.reduce((a, b) => a + b);
const UP_EDGE = 95;

// Предметы. Хочешь свою картинку — положи файл в assets/ и добавь img:'assets/bear.png'
// r — редкость 0..4, v — цена в звёздах (продажа 1 к 1)
const ITEMS = {
  // tiny 1–7 (для дешёвых кейсов)
  gum_ball: { n: 'Gum Ball', e: '🟣', v: 1, r: 0 },
  paper_plane: { n: 'Paper Plane', e: '✈️', v: 2, r: 0 },
  lucky_penny: { n: 'Lucky Penny', e: '🪙', v: 3, r: 0 },
  mini_balloon: { n: 'Mini Balloon', e: '🎈', v: 4, r: 0 },
  confetti_pop: { n: 'Confetti Pop', e: '🎉', v: 6, r: 0 },
  // common 5–35
  candy_cane: { n: 'Candy Cane', e: '🍬', v: 5, r: 0 },
  lol_pop: { n: 'Lol Pop', e: '🍭', v: 8, r: 0 },
  cookie_heart: { n: 'Cookie Heart', e: '🍪', v: 12, r: 0 },
  jelly_bunny: { n: 'Jelly Bunny', e: '🐰', v: 15, r: 0 },
  ice_cream: { n: 'Ice Cream', e: '🍦', v: 18, r: 0 },
  ginger_cookie: { n: 'Ginger Cookie', e: '🍪', v: 22, r: 0 },
  party_sparkler: { n: 'Party Sparkler', e: '✨', v: 28, r: 0 },
  fresh_socks: { n: 'Fresh Socks', e: '🧦', v: 35, r: 0 },
  // uncommon 45–130

function setBal(v) { bal = Math.max(0, Math.round(v)); store.set(balanceStorageKey, bal); tween(); checkBet(); }
function tween() {
  const el = $('#bal'), a = shown, b = bal, t0 = performance.now();
  const f = t => { const k = Math.min(1, (t - t0) / 500); shown = Math.round(a + (b - a) * k); el.textContent = fmt(shown); if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
// Опыт: кейсы дают полный опыт, игры — 5% от ставки, но не более 25 опыта за игру (медленный фарм уровней в играх)
const XP_CASE_RATE = 1, XP_GAME_RATE = 0.05, XP_GAME_BET_CAP = 500; // в играх опыт считается максимум с 500⭐ ставки (макс. 25 опыта за игру)
const MAX_LVL = 1000, RTP_BASE = 0.47, RTP_PER_LVL = 0.0001; // +0.01% RTP за уровень
const lvlOf = x => Math.min(MAX_LVL, Math.floor(Math.sqrt(x / 20)) + 1), xpAt = l => 20 * (l - 1) * (l - 1);
function addXp(n, rate = 1) {
  P.xp += n * rate; const nl = lvlOf(P.xp);
  if (nl > P.lvl) {
    let r = 0; for (let l = P.lvl + 1; l <= nl; l++) r += l * 2;
    P.lvl = nl; setBal(bal + r); toast('Уровень ' + nl + '! +' + S(r)); hap('success');
  }
}
function qday() { const d = new Date().toDateString(); if (P.q.d !== d) P.q = { d, p: {}, c: {} }; }

function dayKey(d = new Date()) { return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); }
function dayDiff(a, b) { const [ay,am,ad]=a.split('-').map(Number), [by,bm,bd]=b.split('-').map(Number); return Math.round((Date.UTC(by,bm-1,bd)-Date.UTC(ay,am-1,ad))/86400000); }

function checkBet() { const g = $('#go'); if (g && !busy) g.disabled = bet < 1 || bet > bal; }
function toast(t) {

function msg(t, c) { const m = $('#msg'); m.className = 'msg'; void m.offsetWidth; m.innerHTML = t || ''; m.className = 'msg ' + (c || ''); }

}
function take() {
  if (busy || bet < 1 || bet > bal) return false;
  busy = true; P.turn += bet; P.games++; qadd('g'); qadd('t', bet);
  setBal(bal - bet); addXp(Math.min(bet, XP_GAME_BET_CAP), XP_GAME_RATE); msg(''); lock(true);
  return true;
}
function settle(pay, b) {
  pay = Math.round(pay);

  busy = false; lock(false);
  if (pay > b) { P.wins++; qadd('w'); P.best = Math.max(P.best, pay - b); msg('+' + S(pay - b), 'win'); hap('success'); flash(); }
  else if (pay === b) msg('Ставка возвращена');

}

const liveEvents = [];
function pushLive(name, itemId, fromCase) {
  const it = ITEMS[itemId]; if (!it) return;
  liveEvents.unshift({ name, itemId, fromCase, t: Date.now() });
  if (liveEvents.length > 40) liveEvents.length = 40;
  renderLive();
}
function renderLive() {
  const track = $('#live-track'); if (!track) return;
  const items = liveEvents.length ? liveEvents : [{ name: 'DabUP', itemId: Object.keys(ITEMS)[0], fromCase: 'Кейс' }];
  const row = items.map(e => {
    const it = ITEMS[e.itemId] || { n: '?', v: 0 };
    return `<span class="live-item">${itemArt(e.itemId, 18)} <b>${e.name}</b> · ${it.n} · ${S(it.v)}</span>`;
  }).join('');
  // duplicate for seamless scroll
  track.innerHTML = `<div class="live-track-inner">${row}${row}</div>`;
}
function botTick() {
  try {
    const name = BOT_LIVE_NAMES[Math.random() * BOT_LIVE_NAMES.length | 0] + (Math.random() * 80 + 10 | 0);
    const ids = Object.keys(ITEMS);
    // weight towards cheaper items
    const id = ids[Math.min(ids.length - 1, (Math.random() ** 2 * ids.length) | 0)];
    const cases = CASES.filter(c => !c.free);
    const c = cases[Math.random() * cases.length | 0];
    pushLive(name, id, c ? c.name : 'Кейс');
  } catch (e) {}
  setTimeout(botTick, 900 + Math.random() * 1600);
}


/* ---------- глобальная ракета (работает даже если ты не в игре) ---------- */
const CrashEngine = (() => {
  const state = {
    phase: 'wait', // wait | fly | end
    waitLeft: 10,
    m: 1,
    cp: 2,
    forcedCp: null, // admin @ezmarad: фиксированный краш, иначе null = рандом
    t0: 0,
    raf: 0,
    lastTier: 0,
    bots: [],
    myBet: 0,
    cashed: false,
    listeners: new Set(),
    timer: 0
  };
  if (!P.crashHist) P.crashHist = [];
  const BOT_NAMES = (typeof BOT_LIVE_NAMES !== 'undefined' && BOT_LIVE_NAMES.length) ? BOT_LIVE_NAMES : ['Alex','Neo','Luna'];
  const nftIds = () => Object.keys(ITEMS).filter(k => ITEMS[k].nft || ITEMS[k].r >= 3);
  const emit = () => state.listeners.forEach(fn => { try { fn(state); } catch (e) {} });
  const crashPoint = () => Math.min(500, Math.max(1.01, Math.floor(97 / (1 - Math.random())) / 100));
  const multAt = (elapsedMs) => {
    let base = Math.pow(1.042, elapsedMs / 100);
    if (base > 5) base = 5 + (base - 5) * 1.25;
    if (base > 10) base = 10 + (base - 10) * 1.35;
    if (base > 20) base = 20 + (base - 20) * 1.5;
    if (base > 50) base = 50 + (base - 50) * 1.7;
    if (base > 100) base = 100 + (base - 100) * 2.1;
    return base;
  };
  const makeBot = () => {
    const nfts = nftIds();
    const name = BOT_NAMES[Math.random() * BOT_NAMES.length | 0] + (Math.random() * 900 + 10 | 0);
    const target = 1.12 + Math.random() * Math.random() * 28;
    if (Math.random() < 0.3 && nfts.length) {
      const itemId = nfts[Math.random() * nfts.length | 0];
      const it = ITEMS[itemId];
      return { name, kind: 'nft', itemId, itemName: it.n, bet: it.v, target, cashed: false, out: 0 };
    }
    const betAmt = [1,2,5,10,15,25,50,75,100,150,200,250,500,750,1000,1500,2000,3500,5000,8000][Math.random() * 20 | 0];
    return { name, kind: 'stars', bet: betAmt, target, cashed: false, out: 0 };
  };
  const spawnBots = () => {
    // всегда плотный стол ставок (и когда игрока нет на экране)
    state.bots = [];
    const n = 22 + (Math.random() * 20 | 0); // 22–41
    for (let i = 0; i < n; i++) state.bots.push(makeBot());
  };
  const ensureFilled = (minCount = 18) => {
    // если мало — докидываем имитацию
    while (state.bots.length < minCount) state.bots.push(makeBot());
  };
  const addLateBots = () => {
    if (state.phase !== 'wait') return;
    const extra = 3 + (Math.random() * 6 | 0);
    for (let i = 0; i < extra; i++) state.bots.push(makeBot());
    ensureFilled(20);
  };
  const setWait = () => {
    state.phase = 'wait'; state.waitLeft = 10; state.m = 1; state.lastTier = 0;
    state.myBet = 0; state.cashed = false;
    spawnBots(); ensureFilled(20); emit();
  };
  const finish = () => {
    cancelAnimationFrame(state.raf);
    state.phase = 'end';
    P.crashHist.push(state.cp);
    if (P.crashHist.length > 20) P.crashHist = P.crashHist.slice(-20);
    save();
    if (state.myBet && !state.cashed) {
      // проиграл — settle если ставка была
      try { settle(0, state.myBet); } catch (e) {}
      state.myBet = 0;
    }
    state.bots.forEach(b => { if (!b.cashed && b.target <= state.cp) { b.cashed = true; b.out = b.target; } });
    emit();
    setTimeout(() => { setWait(); loopWait(); }, 2000);
  };
  const tick = (now) => {
    if (state.phase !== 'fly') return;
    state.m = multAt(now - state.t0);
    state.bots.forEach(b => {
      if (!b.cashed && state.m >= b.target) { b.cashed = true; b.out = Math.floor(b.target * 100) / 100; }
    });
    if (state.m >= state.cp) { finish(); return; }
    emit();
    state.raf = requestAnimationFrame(tick);
  };
  const startFly = () => {
    state.phase = 'fly';
    state.cp = (state.forcedCp && state.forcedCp >= 1.01) ? Math.min(1000, state.forcedCp) : crashPoint();
    state.m = 1;
    state.t0 = performance.now();
    state.lastTier = 0;
    emit();
    state.raf = requestAnimationFrame(tick);
  };
  const loopWait = () => {
    if (state.phase !== 'wait') return;
    state.waitLeft -= 0.1;
    if (state.waitLeft <= 0) { startFly(); return; }
    if ((state.waitLeft * 10 | 0) % 10 === 0) addLateBots();
    ensureFilled(16);
    emit();
    state.timer = setTimeout(loopWait, 100);
  };
  const placeBet = (amount) => {
    if (state.phase !== 'wait' || state.myBet) return false;
    if (amount < 1 || amount > bal || busy) return false;
    if (!take()) return false;
    state.myBet = amount; state.cashed = false; emit();
    return true;
  };
  const cashOut = () => {
    if (state.phase !== 'fly' || !state.myBet || state.cashed) return false;
    state.cashed = true;
    const got = Math.floor(state.m * 100) / 100;
    const bet = state.myBet;
    state.myBet = 0; // ракета летит дальше, ставка закрыта
    settle(bet * got, bet);
    emit();
    return got;
  };
  // start engine once
  setWait();
  loopWait();
  return {
    state,
    subscribe(fn) { state.listeners.add(fn); fn(state); return () => state.listeners.delete(fn); },
    placeBet, cashOut,
    setForcedCp(v) {
      if (v === null || v === '' || v === undefined) { state.forcedCp = null; emit(); return true; }
      const n = +v;
      if (!(n >= 1.01) || n > 1000) return false;
      state.forcedCp = Math.round(n * 100) / 100;
      emit();
      return true;
    },
    hist: () => (P.crashHist || []).slice(-20)
  };
})();

  upgrade: {
    name: 'Апгрейд', glyph: '⚡', desc: 'Звёзды или предметы', cls: 't-up wide',
    mount(s) {
      const M = [1.5, 2, 3, 5, 10];
      let mult = 2, rot = 0, mode = 'stars', invIdx = -1, targetId = null, fast = false;
      const itemIds = () => Object.keys(ITEMS);
      const fromId = () => invIdx >= 0 ? P.inv[invIdx] : null;
      const fromIt = () => { const id = fromId(); return id ? ITEMS[id] : null; };
      const pickByMult = () => {
        const fr = fromIt(); if (!fr) { targetId = null; return; }
        const want = fr.v * mult;
        let best = null, bestD = Infinity;
        itemIds().forEach(id => {
          const v = ITEMS[id].v;
          if (v <= fr.v) return;
          const d = Math.abs(v - want);
          if (d < bestD) { bestD = d; best = id; }
        });
        targetId = best;
      };
      const filteredTargets = () => {
        const fr = fromIt(); if (!fr) return [];
        return itemIds().filter(id => ITEMS[id].v > fr.v).sort((a, b) => ITEMS[a].v - ITEMS[b].v);
      };
      const chanceStars = () => UP_EDGE / mult;
      const chanceItem = () => {
        const fr = fromIt(), to = targetId && ITEMS[targetId];
        if (!fr || !to) return 0;
        return Math.max(1, Math.min(92, (fr.v / to.v) * 90));
      };
      const draw = () => {
        const invList = P.inv.map((id, i) => ({ id, i, it: ITEMS[id] })).filter(x => x.it);
        const targets = filteredTargets();
        const fr = fromIt();
        const c = mode === 'stars' ? chanceStars() : chanceItem();
        const pay = mode === 'stars' ? S(Math.round(bet * mult)) : (targetId ? ITEMS[targetId].n : '—');
        s.innerHTML = `
          <div class="seg" id="mode">
            <button data-m="stars" class="${mode === 'stars' ? 'on' : ''}">⭐ Звёзды</button>
            <button data-m="item" class="${mode === 'item' ? 'on' : ''}">🎁 Предмет</button>
          </div>
          <div class="wheelwrap"><div class="ptr"></div><div class="wheel" id="wh"></div><div class="wc" id="wc"></div></div>
          <button class="go" id="go" style="margin-top:8px">${mode === 'stars' ? 'Прокачать' : 'Апгрейд предмета'}</button>
          <div class="seg" id="ms">${M.map(m => `<button data-v="${m}" class="${m === mult ? 'on' : ''}">x${m}</button>`).join('')}</div>
          <div class="info" id="inf"></div>
          <div id="item-ui" ${mode === 'item' ? '' : 'hidden'}>
            <div class="note" style="margin:6px 0 8px">Исходный предмет из инвентаря</div>
            <div class="upg-grid" id="invg">${invList.length ? invList.map(({ id, i, it }) =>
              `<button data-i="${i}" class="${i === invIdx ? 'on' : ''}">${itemArt(id, 28)}<span>${it.n}</span><small>${S(it.v)}</small></button>`
            ).join('') : '<p class="note">Инвентарь пуст</p>'}</div>
            <div class="note" style="margin:10px 0 6px">Цель · x${mult} подберёт ближайший по цене</div>
            <div class="upg-grid" id="tgtg">${targets.slice(0, 30).map(id => {
              const it = ITEMS[id];
              return `<button data-t="${id}" class="${id === targetId ? 'on' : ''}">${itemArt(id, 28)}<span>${it.n}</span><small>${S(it.v)}</small></button>`;
            }).join('') || '<p class="note">Нет подходящих целей</p>'}</div>
            <div class="fast-row" style="margin-top:8px"><button id="fast" class="${fast ? 'on' : ''}">Фаст спин ${fast ? 'ON' : 'OFF'}</button></div>
          </div>`;
        $('#wh').style.background = `conic-gradient(var(--green) 0 ${c * 3.6}deg,var(--panel2) ${c * 3.6}deg 360deg)`;
        if (mode === 'stars') {
          $('#wc').innerHTML = `x${mult}<small>${pay}</small>`;
          $('#inf').innerHTML = `Шанс <b>${c.toFixed(1)}%</b><br>Ставка ${S(bet)} → <b>${pay}</b>, при неудаче сгорит`;
        } else {
          const to = targetId && ITEMS[targetId];
          $('#wc').innerHTML = `${c.toFixed(0)}%<small>${to ? to.n : '—'}</small>`;
          $('#inf').innerHTML = fr && to
            ? `Шанс <b>${c.toFixed(1)}%</b><br>${fr.n} (${S(fr.v)}) → <b>${to.n}</b> (${S(to.v)})`
            : 'Выбери предмет и цель';
        }
        s.querySelectorAll('#mode button').forEach(b => b.onclick = () => {
          mode = b.dataset.m;
          if (mode === 'stars') { $('#bets').hidden = false; renderBet(); }
          else { $('#bets').hidden = true; if (invIdx < 0 && P.inv.length) invIdx = 0; pickByMult(); }
          draw();
        });
        s.querySelectorAll('#ms button').forEach(b => b.onclick = () => {
          mult = +b.dataset.v;
          if (mode === 'item') pickByMult();
          draw();
        });
        const invg = $('#invg');
        if (invg) invg.querySelectorAll('button[data-i]').forEach(b => b.onclick = () => {
          invIdx = +b.dataset.i; pickByMult(); draw();
        });
        const tgtg = $('#tgtg');
        if (tgtg) tgtg.querySelectorAll('button[data-t]').forEach(b => b.onclick = () => {
          targetId = b.dataset.t; draw();
        });
        
        const fastBtn = $('#fast');
        if (fastBtn) fastBtn.onclick = () => { fast = !fast; draw(); };
        $('#go').onclick = async () => {
          if (busy) return;
          if (mode === 'stars') {
            const b = bet; if (!take()) return;
            const c = chanceStars(), deg = c * 3.6, win = Math.random() * 100 < c;
            const tgt = win ? 3 + Math.random() * Math.max(4, deg - 6) : deg + 3 + Math.random() * Math.max(20, 354 - deg);
            const spins = fast ? 2 : 5, dur = fast ? 900 : 3200;
            rot += 360 * spins + ((((360 - tgt) - (rot % 360)) % 360) + 360) % 360;
            $('#wh').style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.1,1)`;
            $('#wh').style.transform = `rotate(${rot}deg)`;
            await sleep(dur + 50);
            settle(win ? b * mult : 0, b);
            return;
          }
          // item mode
          const frId = fromId(); const fr = fromIt(); const to = targetId && ITEMS[targetId];
          if (!fr || !to || invIdx < 0) { toast('Выбери предмет и цель'); return; }
          if (P.inv[invIdx] !== frId) { toast('Предмет уже изменён'); return; }
          busy = true; lock(true); msg('');
          const c = chanceItem(), deg = c * 3.6, win = Math.random() * 100 < c;
          const tgt = win ? 3 + Math.random() * Math.max(4, deg - 6) : deg + 3 + Math.random() * Math.max(20, 354 - deg);
          const spins = fast ? 2 : 5, dur = fast ? 900 : 2800;
          rot += 360 * spins + ((((360 - tgt) - (rot % 360)) % 360) + 360) % 360;
          $('#wh').style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.1,1)`;
          $('#wh').style.transform = `rotate(${rot}deg)`;
          await sleep(dur + 50);
          P.inv.splice(invIdx, 1);
          if (win) {
            P.inv.push(targetId); save(); hap('success'); flash();
            msg('+' + ITEMS[targetId].n, 'win');
            toast('Апгрейд: ' + ITEMS[targetId].n);
          } else {
            save(); hap('error'); msg('Предмет сгорел', 'lose'); toast('Не удалось');
          }
          invIdx = -1; targetId = null; busy = false; lock(false); draw();
        };
      };
      // hide bets only when item mode active later
      draw();
      hook = () => { if (mode === 'stars') draw(); };
    }
  }
};

/* ---------- экран кейса ---------- */
function caseMount(s, d) {
  const f = !!d.free;
  const tier = v => v === 15 ? 3 : v >= 10 ? 2 : v >= 5 ? 1 : 0;
  let qty = 1, fast = false;
  // Платные кейсы: RTP ровно 47%, без «Пусто».
  // Добавляем предметы дешевле кейса или в его цену, затем подбираем вес дорогих так, чтобы RTP = 47%.
  const rtpFor = () => Math.min(MAX_LVL, P.lvl) - 1 > 0 ? RTP_BASE + (Math.min(MAX_LVL, P.lvl) - 1) * RTP_PER_LVL : RTP_BASE;
  let targetRTP = rtpFor();
  const buildItems = () => {
    const list = d.items.filter(([id]) => ITEMS[id]).map(([id, p]) => ({ ...ITEMS[id], id, p }));
    const have = new Set(list.map(x => x.id));
    const pool = Object.keys(ITEMS)
      .filter(id => !have.has(id) && ITEMS[id].v <= d.cost && ITEMS[id].v >= d.cost * 0.12)
      .sort((x, y) => ITEMS[x].v - ITEMS[y].v);
    const N = Math.min(9, pool.length);
    const chosen = N ? Array.from({ length: N }, (_, i) => pool[Math.round(i * (pool.length - 1) / Math.max(1, N - 1))]) : [];
    [...new Set(chosen)].forEach(id => list.push({ ...ITEMS[id], id, p: Math.pow(d.cost / ITEMS[id].v, 1.4) * 6, filler: 1 }));
    const low = list.filter(x => x.v <= d.cost), high = list.filter(x => x.v > d.cost);
    const T = targetRTP * d.cost;
    const lw = low.reduce((a, x) => a + x.p, 0), lv = low.reduce((a, x) => a + x.p * x.v, 0);
    const hw = high.reduce((a, x) => a + x.p, 0), hv = high.reduce((a, x) => a + x.p * x.v, 0);
    if (hw > 0 && T * lw > lv && hv > T * hw) {
      const k = (T * lw - lv) / (hv - T * hw);
      high.forEach(x => x.p *= k);
    }
    return list.sort((x, y) => x.v - y.v);
  };
  let its = null, totalWeight = 0, baseEV = 0;
  const hitChance = 1, emptyChance = 0;
  const emptyResult = { empty: true, n: 'Пусто', v: 0, r: 0 };
  const rebuild = () => {
    if (f) return;
    targetRTP = rtpFor();
    its = buildItems();
    totalWeight = its.reduce((sum, i) => sum + i.p, 0);
    baseEV = its.reduce((sum, i) => sum + (i.p / totalWeight) * i.v, 0);
  };
  rebuild();
  const pick = () => {
    if (f) { const v = drop(); return { free: true, v, r: tier(v) }; }
    let r = Math.random() * totalWeight;
    for (const i of its) { r -= i.p; if (r < 0) return i; }
    return its[its.length - 1];
  };
  const cell = it => `<div class="cell r${it.r}">${it.free ? `<b>${it.v}</b>` : it.empty ? '<b>✕</b>' : itemArt(it.id || it, 44)}<small>${it.free || it.empty ? (it.empty ? 'Пусто' : '') : fmt(it.v)}</small></div>`;
  const bin = (a, b) => DROP_W.slice(a, b + 1).reduce((x, y) => x + y) / DROP_T * 100, pc = p => (+p.toFixed(2)) + '%';
  const getOdds = () => f
    ? [[0, 0], [1, 4], [5, 9], [10, 14], [15, 15]].map(([a, b]) => `<div class="oc r${tier(b)}"><b>${a === b ? a : a + '–' + b}${STAR}</b><i>${pc(bin(a, b))}</i></div>`)
    : [
        ...(emptyChance > 0 ? [`<div class="oc r0"><span>✕ Пусто</span><b>0${STAR}</b><i>${pc(emptyChance * 100)}</i></div>`] : []),
        ...its.map(i => `<div class="oc r${i.r}">${itemArt(i.id, 36)}<span>${i.n}${i.nft ? '<em class="pill">NFT</em>' : ''}</span><b>${S(i.v)}</b><i>${pc((i.p / totalWeight) * hitChance * 100)}</i></div>`)
      ];
  const drawChrome = () => {
    rebuild();
    const odds = getOdds();
    const total = f ? 0 : d.cost * qty;
    s.innerHTML = `<div class="cwin"><div class="cmark"></div><div class="cstrip" id="cs"></div></div>
      ${f ? '' : `<div class="seg" id="qty">${[1,2,3,4,5].map(n => `<button data-q="${n}" class="${n===qty?'on':''}">x${n}</button>`).join('')}</div>
      <div class="fast-row"><button id="fast" class="${fast?'on':''}">Быстрое открытие ${fast?'ON':'OFF'}</button></div>`}
      <button class="go" id="open"></button>
      <h3 class="oh">Что может выпасть</h3>
      ${f ? '' : `<p class="note" style="text-align:center">RTP: ${(baseEV / d.cost * 100).toFixed(2)}% (бонус уровня +${((Math.min(MAX_LVL, P.lvl) - 1) * RTP_PER_LVL * 100).toFixed(2)}%)</p>`}
      <div class="odds">${odds.join('')}</div>`;
    const cs = $('#cs'), btn = $('#open'), win = $('.cwin', s);
    const place = (i, j) => { cs.style.transform = `translateX(${win.offsetWidth / 2 - (i * 76 + 36) + j}px)`; };
    cs.innerHTML = Array.from({ length: 12 }, pick).map(cell).join(''); place(3, 0);
    const refresh = () => {
      const l = f ? caseLeft() : 0;
      const need = f ? 0 : d.cost * qty;
      btn.disabled = busy || l > 0 || (!f && bal < need);
      if (f) btn.innerHTML = l > 0 ? 'Следующий через ' + leftText(l) : 'Открыть бесплатно';
      else btn.innerHTML = qty > 1 ? `Открыть x${qty} · ${S(need)}` : 'Открыть за ' + S(d.cost);
    };
    refresh();
    if (!f) {
      s.querySelectorAll('#qty button').forEach(b => b.onclick = () => { if (busy) return; qty = +b.dataset.q; drawChrome(); });
      const fb = $('#fast'); if (fb) fb.onclick = () => { if (busy) return; fast = !fast; drawChrome(); };
    }
    btn.onclick = async () => {
      if (btn.disabled) return;
      const n = f ? 1 : qty;
      const need = f ? 0 : d.cost * n;
      if (!f && bal < need) { toast('Недостаточно звёзд'); return; }
      busy = true; btn.disabled = true; msg('');
      if (!f) { P.turn += need; setBal(bal - need); addXp(need, XP_CASE_RATE); }
      const wins = Array.from({ length: n }, pick);
      const w = wins[wins.length - 1];
      const arr = Array.from({ length: 40 }, pick); arr[34] = w;
      cs.style.transition = 'none'; cs.innerHTML = arr.map(cell).join(''); place(2, 0);
      cs.getBoundingClientRect();
      const dur = fast ? 900 : 4000;
      cs.style.transition = `transform ${dur}ms cubic-bezier(.12,.6,.1,1)`;
      place(34, Math.round(Math.random() * 40 - 20));
      await sleep(dur + 120);
      qadd('c', n); busy = false;
      if (f) {
        store.set('caseAt', Date.now()); setBal(bal + w.v);
        msg(w.v ? '+' + S(w.v) : 'Пусто. Приходи завтра', w.v ? 'win' : '');
        if (w.v) { hap('success'); flash(); }
      } else {
        wins.forEach(x => { if (x && x.id) P.inv.push(x.id); });
        save(); hap('success'); flash();
        if (n === 1) {
          if (w.empty) {
            modal(`<h3>✕ Пусто</h3><p>В этот раз предмет не выпал.</p>`, [
              { t: 'Понятно' }
            ]);
          } else {
            modal(`<div class="big r${w.r}">${itemArt(w.id, 96)}</div><h3>${w.n}${w.nft ? '<em class="pill">NFT</em>' : ''}</h3><p>Стоимость ${S(w.v)}</p>`, [
              { t: 'Продать за ' + S(w.v), c: 'ok', f: () => { P.inv.splice(P.inv.lastIndexOf(w.id), 1); save(); setBal(bal + w.v); } },
              { t: 'Оставить в инвентаре' }
            ]);
          }
        } else {
          const totalV = wins.reduce((s, x) => s + (x.v || 0), 0);
          const list = wins.map(x => x.empty
            ? `<div class="oc r0"><span>✕ Пусто</span><b>0${STAR}</b></div>`
            : `<div class="oc r${x.r}">${itemArt(x.id, 28)}<span>${x.n}</span><b>${S(x.v)}</b></div>`).join('');
          modal(`<h3>Открыто x${n}</h3><div class="odds" style="max-height:240px;overflow:auto">${list}</div><p>Суммарно ${S(totalV)}</p>`, [
            { t: 'Продать всё · ' + S(totalV), c: 'ok', f: () => {
              wins.forEach(x => {
                if (!x.id) return;
                const i = P.inv.lastIndexOf(x.id);
                if (i >= 0) P.inv.splice(i, 1);
              });
              save(); setBal(bal + totalV);
            } },
            { t: 'Оставить в инвентаре' }
          ]);
        }
      }
      drawChrome();
    };
  };
  drawChrome();
}

    }
    if (e.target.closest('#admin-set-balance')) {
      const input = $('#admin-set-bal');
      const val = Number(input && input.value);
      if (!Number.isSafeInteger(val) || val < 0 || val > 10000000) {
        toast('Введи число от 0 до 10 000 000');
        return;
      }
      setBal(val);
      if (input) input.value = '';
      toast('Баланс установлен: ' + S(val));
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-case')) {
      store.set('caseAt', 0);
      toast('Таймер ежедневного кейса сброшен');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-quests')) {
      qday();
      P.q = { d: P.q.d, p: {}, c: {} };
      save();
      toast('Задания на сегодня сброшены');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-clear-inv')) {
      P.inv = [];
      save();
      toast('Инвентарь очищен');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-give-item')) {
      const ids = Object.keys(ITEMS);
      const id = ids[Math.floor(Math.random() * ids.length)];
      P.inv.push(id);
      save();
      toast('Выдан предмет: ' + ITEMS[id].n);
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-progress')) {
      P.turn = 0; P.games = 0; P.wins = 0; P.best = 0; P.xp = 0; P.lvl = 1;
      save();
      toast('Прогресс (XP/игры/победы) сброшен');
      rProfile();
      return;
    }
  }
  // Sys-admin (@slizmix)
  if (isSysAdmin()) {
    if (e.target.closest('#sys-add-stars')) {
      const input = $('#sys-stars');
      const amount = Number(input && input.value);
      const daily = getAdminDaily();
      const role = getAdminRole();
      if (!Number.isSafeInteger(amount) || amount < 1 || amount > role.maxAddDaily) {
        toast('Введи число от 1 до ' + role.maxAddDaily);
        return;
      }
      if (daily.added + amount > role.maxAddDaily) {
        toast('Лимит на сегодня: осталось ' + (role.maxAddDaily - daily.added));
        return;
      }
      daily.added += amount;
      setAdminDaily(daily);
      setBal(bal + amount);
      if (input) input.value = '';
      toast('Добавлено ' + S(amount) + ' (сегодня ' + daily.added + '/' + role.maxAddDaily + ')');
      rProfile();
      return;
    }
    if (e.target.closest('#sys-reset-case')) {
      const daily = getAdminDaily();
      const role = getAdminRole();
      if (daily.resets >= role.maxResetsDaily) {
        toast('Лимит сбросов кейса на сегодня исчерпан (3/3)');
        return;
      }
      daily.resets += 1;
      setAdminDaily(daily);
      store.set('caseAt', 0);
      toast('Таймер кейса сброшен (' + daily.resets + '/' + role.maxResetsDaily + ')');
      rProfile();
      return;
    }
  }
});
$('#v-earn').addEventListener('click', e => {
  const earn = P.earn;
  if (e.target.closest('#earn-refresh')) {
    toast('Закрываю DabUP. Открой мини-приложение заново для обновления профиля.');
    setTimeout(() => { if (tg && tg.close) tg.close(); else location.reload(); }, 900);
    return;
  }
  if (e.target.closest('#earn-confirm')) {
    if (!hasBotTag()) { toast('Не найдено. ' + telegramNameDebug()); return; }
    earn.confirmed = true; save(); toast('Имя Telegram проверено ✓'); rEarn(); return;
  }
  if (e.target.closest('#earn-claim')) {
    const today = dayKey();
    if (!hasBotTag() || earn.lastClaim === today) { if (!hasBotTag()) toast('Не найдено. ' + telegramNameDebug()); return; }
    earn.streak = earn.lastClaim && dayDiff(earn.lastClaim, today) === 1 ? earn.streak + 1 : 1;
    const reward = earnReward(earn.streak);
    earn.rubBalance += reward;
    earn.lastClaim = today;
    save(); hap('success'); toast('+' + fmt(reward) + ' ₽'); rEarn();
  }
});
$('#v-profile').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'promo-code') $('#promo-claim').click();
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) tab(b.dataset.t); });
$('#back').onclick = back;
if (tg) tg.BackButton.onClick(back);
$('#bal').textContent = fmt(bal);
tab('games');
renderLive();
setTimeout(botTick, 1200);
</script>
