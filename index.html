<style>

#toast.show{transform:translate(-50%,0)}
/* DabUP case artwork */
.cc{position:relative;isolation:isolate;overflow:hidden;border:1px solid rgba(255,255,255,.09);min-height:94px;box-shadow:0 9px 24px rgba(0,0,0,.16)}
.cc:before{content:"";position:absolute;inset:0;z-index:-1;opacity:.95;pointer-events:none}

.cc .ce{width:66px;height:66px;font-size:40px;flex:none;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 8px 18px rgba(0,0,0,.2);border:1px solid rgba(255,255,255,.1)}
.cc .ct b{letter-spacing:-.35px}.cc em{box-shadow:0 4px 14px rgba(0,0,0,.18);white-space:nowrap}

.cc.case-bear:before,.cc.case-lucky:before,.cc.case-prem:before,.cc.case-elite:before{background:radial-gradient(ellipse at 15% 50%,rgba(255,190,90,.18),transparent 60%),linear-gradient(110deg,#3a2a55,#241e3a)}
.cc.case-pocket:before,.cc.case-spare:before,.cc.case-starter:before{background:radial-gradient(ellipse at 15% 50%,rgba(160,170,200,.2),transparent 60%),linear-gradient(110deg,#2a3048,#1e2438)}
.cc.case-neon:before,.cc.case-pulse:before{background:radial-gradient(ellipse at 15% 50%,rgba(180,80,255,.28),transparent 55%),linear-gradient(110deg,#3a1a5a,#1e1538)}
.cc.case-midnight:before,.cc.case-shadow:before{background:radial-gradient(ellipse at 15% 50%,rgba(60,80,180,.3),transparent 55%),linear-gradient(110deg,#1a1e3a,#121528)}
.cc.case-black:before,.cc.case-vault:before{background:radial-gradient(ellipse at 15% 50%,rgba(40,40,50,.4),transparent 55%),linear-gradient(110deg,#1a1a22,#0e0e14)}
.cc.case-legend:before,.cc.case-absolute:before{background:radial-gradient(ellipse at 15% 50%,rgba(246,196,83,.28),transparent 55%),linear-gradient(110deg,#3a2a12,#1e1810)}

.cc.case-free .ce{background:linear-gradient(145deg,#277a61,#294c58)}
.cc.case-pocket .ce,.cc.case-spare .ce,.cc.case-starter .ce{background:linear-gradient(145deg,#4a5578,#2e3548)}
.cc.case-bear .ce,.cc.case-lucky .ce,.cc.case-prem .ce,.cc.case-elite .ce{background:linear-gradient(145deg,#6a4ab0,#3d2a6e)}
.cc.case-neon .ce,.cc.case-pulse .ce{background:linear-gradient(145deg,#8b3dff,#4a1a8a)}
.cc.case-midnight .ce,.cc.case-shadow .ce{background:linear-gradient(145deg,#3a4a9a,#1e2858)}
.cc.case-black .ce,.cc.case-vault .ce{background:linear-gradient(145deg,#2a2a32,#141418)}
.cc.case-legend .ce,.cc.case-absolute .ce{background:linear-gradient(145deg,#c9a227,#6a4a10)}
.case-cat{font:800 13px Unbounded,sans-serif;color:var(--muted);margin:18px 0 10px;letter-spacing:.02em;text-transform:uppercase}
.case-cat:first-of-type{margin-top:6px}
.ce{display:grid;place-items:center;overflow:hidden}
.ce .ci{width:50px;height:50px;display:block;filter:drop-shadow(0 2px 5px rgba(0,0,0,.3))}
.ce .ci-fallback{font-size:40px;line-height:1;filter:drop-shadow(0 2px 4px rgba(0,0,0,.25))}
.case-hero{padding:18px 16px 14px;border-radius:20px;margin:0 0 14px;background:linear-gradient(130deg,#29204a,#171b36);border:1px solid rgba(255,255,255,.09);position:relative;overflow:hidden}
.case-hero:after{content:"✦";position:absolute;right:15px;top:-14px;font-size:90px;color:rgba(255,255,255,.07);transform:rotate(15deg)}

<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#F29A12"/></linearGradient></defs><symbol id="star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.2L12 17.9l-6.4 3.6L7 14.3 1.7 9.3l7.2-.9z" fill="url(#sg)" stroke="#C47F08" stroke-width="1" stroke-linejoin="round"/></symbol></svg>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#15102B'); tg.setBackgroundColor('#15102B'); } catch (e) {} }
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => n.toLocaleString('ru-RU');
const hap = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const STAR = '<svg class="st" width="16" height="16" viewBox="0 0 24 24"><use href="#star"/></svg>', S = n => fmt(n) + STAR;
const getTelegramUser = () => {
  // В Mini App профиль передаётся Telegram при открытии приложения.
  // Берём initDataUnsafe, а если его нет — читаем user из initData.
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) return tg.initDataUnsafe.user;
  try {
    const raw = new URLSearchParams(tg && tg.initData || '').get('user');
    return raw ? JSON.parse(raw) : null;
  } catch (e) { return null; }
};
const u = getTelegramUser();
const accountStorageId = u && u.id ? String(u.id) : 'no-telegram-id';
// Проверяем только поля «Имя» и «Фамилия» Telegram, без учёта регистра и невидимых символов.
const hasBotTag = () => {
  if (!u) return false;
  const profileName = `${u.first_name || ''} ${u.last_name || ''}`
    .normalize('NFKC').replace(/[\u200B-\u200D\uFEFF]/g, '').toLocaleLowerCase();
  return profileName.includes('@dabup_robot');
};
const telegramNameDebug = () => u
  ? `Telegram передаёт: «${u.first_name || '—'}» «${u.last_name || '—'}».`
  : 'Данные профиля Telegram не получены. Открой DabUP через Telegram.';
const ADMIN_USERS = {
  ezmarad: { role: 'full' },
  slizmix: { role: 'sys', maxAddDaily: 10000, maxResetsDaily: 3 }
};
const getAdminRole = () => {
  if (!u || !u.username) return null;
  const key = String(u.username).toLowerCase();
  return ADMIN_USERS[key] || null;
};
const isAdmin = () => getAdminRole()?.role === 'full';
const isSysAdmin = () => getAdminRole()?.role === 'sys';
const isAnyAdmin = () => !!getAdminRole();
// Промокоды: храним с timestamp, скрытый КД на ~200 лет после использования.
// Работает повсеместно через localStorage, привязано к Telegram ID.
const PROMOS = Object.freeze({ NOTSOFAR: 1337, IMRICH: 99999 });
const PROMO_CD_MS = 200 * 365.25 * 24 * 3600 * 1000; // ~200 лет
const promoStorageKey = 'dabup:promo:claimed:' + accountStorageId;
let claimedPromos = store.get(promoStorageKey, {});
// миграция со старого массива
if (Array.isArray(claimedPromos)) {
  const map = {};
  claimedPromos.forEach(c => { map[c] = Date.now(); });
  claimedPromos = map;
  store.set(promoStorageKey, claimedPromos);
}
function isPromoClaimed(code) {
  const ts = claimedPromos[code];
  if (!ts) return false;
  return (Date.now() - ts) < PROMO_CD_MS;
}
function markPromoClaimed(code) {
  claimedPromos = { ...claimedPromos, [code]: Date.now() };
  store.set(promoStorageKey, claimedPromos);
}
// Дневные лимиты для sys-admin (dayKey определён ниже, используем локальный расчёт)
const adminDailyKey = 'dabup:admin:daily:' + accountStorageId;
function getAdminDaily() {
  const d0 = new Date();
  const today = [d0.getFullYear(), String(d0.getMonth()+1).padStart(2,'0'), String(d0.getDate()).padStart(2,'0')].join('-');
  let d = store.get(adminDailyKey, { date: today, added: 0, resets: 0 });
  if (d.date !== today) d = { date: today, added: 0, resets: 0 };
  return d;
}
function setAdminDaily(d) { store.set(adminDailyKey, d); }


/* ---------- настройки ---------- */
const START_BALANCE = 0;
const CASE_COOLDOWN = 24 * 3600 * 1000;
// вес выпадения 0..15 звёзд из бесплатного кейса; 15 — около 0.1%
const DROP_W = [20, 18, 15, 12, 9, 7, 5, 4, 3, 2.5, 2, 1.5, 1, .7, .4, .1];
const DROP_T = DROP_W.reduce((a, b) => a + b);
const UP_EDGE = 95;

// Предметы. Хочешь свою картинку — положи файл в assets/ и добавь img:'assets/bear.png'
// r — редкость 0..4, v — цена в звёздах (продажа 1 к 1)
const ITEMS = {
  // common / cheap
  candy: { n: 'Леденец', e: '🍬', v: 5, r: 0 },
  heart: { n: 'Сердце', e: '❤️', v: 15, r: 0 },
  coin: { n: 'Монетка', e: '🪙', v: 8, r: 0 },
  key: { n: 'Ключик', e: '🔑', v: 12, r: 0 },
  // uncommon
  bear: { n: 'Мишка', e: '🧸', v: 30, r: 1 },
  cake: { n: 'Торт', e: '🎂', v: 50, r: 1 },
  star: { n: 'Звезда удачи', e: '⭐', v: 80, r: 1 },
  ticket: { n: 'Билет', e: '🎫', v: 40, r: 1 },
  // rare
  rose: { n: 'Роза', e: '🌹', v: 100, r: 2 },
  cup: { n: 'Кубок', e: '🏆', v: 150, r: 2 },
  rocket: { n: 'Ракета', e: '🚀', v: 200, r: 2 },
  crystal: { n: 'Кристалл', e: '🔮', v: 350, r: 2 },
  ring: { n: 'Кольцо', e: '💍', v: 300, r: 2 },
  mask: { n: 'Маска', e: '🎭', v: 280, r: 2 },
  // epic
  crown: { n: 'Корона', e: '👑', v: 600, r: 3 },
  phoenix: { n: 'Феникс', e: '🔥', v: 1200, r: 3 },
  diamond: { n: 'Алмаз', e: '💎', v: 1500, r: 3 },
  sword: { n: 'Клинок', e: '⚔️', v: 900, r: 3 },
  orb: { n: 'Сфера', e: '🟣', v: 1800, r: 3 },
  // legendary / nft-style
  unicorn: { n: 'Единорог', e: '🦄', v: 5000, r: 4, nft: 1 },
  dragon: { n: 'Дракон', e: '🐉', v: 8000, r: 4, nft: 1 },
  frog: { n: 'Золотая лягушка', e: '🐸', v: 25000, r: 4, nft: 1 },
  titan: { n: 'Титан', e: '🗿', v: 12000, r: 4, nft: 1 },
  nova: { n: 'Нова', e: '🌌', v: 18000, r: 4, nft: 1 },
  abyss: { n: 'Бездна', e: '🌑', v: 25000, r: 4, nft: 1 }
};
// Кейсы. cat: 'change' | 'core' | 'neon' | 'night' | 'black' | 'legend'
// items: [id, chance%], сумма ≈ 100
const CASES = [
  { id: 'free', name: 'Ежедневный кейс', e: '📦', free: true, cat: 'core' },

  // ——— На сдачу ———
  { id: 'pocket', name: 'Карманный', e: '🪙', cost: 8, cat: 'change',
    items: [['candy', 42], ['coin', 30], ['key', 18], ['heart', 8], ['ticket', 2]] },
  { id: 'spare', name: 'Мелочь', e: '🍬', cost: 15, cat: 'change',
    items: [['candy', 35], ['heart', 28], ['coin', 20], ['key', 12], ['bear', 4], ['star', 1]] },
  { id: 'starter', name: 'Стартовый', e: '🎫', cost: 35, cat: 'change',
    items: [['heart', 30], ['bear', 25], ['ticket', 20], ['cake', 15], ['star', 7], ['rose', 3]] },

  // ——— Основные ———
  { id: 'bear', name: 'Мишкин кейс', e: '🧸', cost: 20, cat: 'core',
    items: [['candy', 48.3], ['heart', 28], ['bear', 15], ['cake', 6.5], ['rose', 2], ['diamond', .2]] },
  { id: 'lucky', name: 'Кейс удачи', e: '🍀', cost: 50, cat: 'core',
    items: [['heart', 35], ['star', 25], ['cake', 18], ['rose', 12], ['rocket', 7], ['phoenix', 2.5], ['unicorn', 0.5]] },
  { id: 'prem', name: 'Премиум кейс', e: '🎁', cost: 100, cat: 'core',
    items: [['bear', 38], ['cake', 30], ['rose', 17], ['cup', 9], ['ring', 4], ['crown', 1.5], ['diamond', .4], ['unicorn', .1]] },
  { id: 'elite', name: 'Элитный кейс', e: '💠', cost: 250, cat: 'core',
    items: [['rose', 30], ['cup', 25], ['crystal', 20], ['ring', 12], ['crown', 7], ['phoenix', 4], ['diamond', 1.5], ['dragon', 0.5]] },

  // ——— Неон ———
  { id: 'neon', name: 'Неоновый', e: '💜', cost: 750, cat: 'neon',
    items: [['crystal', 28], ['mask', 22], ['ring', 18], ['sword', 14], ['crown', 10], ['phoenix', 5], ['orb', 2.2], ['unicorn', 0.8]] },
  { id: 'pulse', name: 'Пульс', e: '⚡', cost: 1200, cat: 'neon',
    items: [['mask', 25], ['sword', 22], ['crystal', 18], ['phoenix', 15], ['orb', 10], ['diamond', 6], ['unicorn', 3], ['dragon', 1]] },

  // ——— Полночь ———
  { id: 'midnight', name: 'Полночь', e: '🌙', cost: 2000, cat: 'night',
    items: [['sword', 24], ['orb', 22], ['phoenix', 18], ['diamond', 15], ['crown', 10], ['unicorn', 7], ['dragon', 3.2], ['titan', 0.8]] },
  { id: 'shadow', name: 'Тень', e: '🦇', cost: 3500, cat: 'night',
    items: [['orb', 26], ['diamond', 22], ['phoenix', 16], ['unicorn', 14], ['dragon', 10], ['titan', 7], ['nova', 4], ['abyss', 1]] },

  // ——— Чёрный рынок ———
  { id: 'black', name: 'Чёрный рынок', e: '🖤', cost: 5000, cat: 'black',
    items: [['diamond', 28], ['unicorn', 24], ['dragon', 18], ['titan', 14], ['orb', 8], ['nova', 5], ['frog', 2.2], ['abyss', 0.8]] },
  { id: 'vault', name: 'Хранилище', e: '🗄️', cost: 8000, cat: 'black',
    items: [['unicorn', 30], ['dragon', 25], ['titan', 18], ['nova', 12], ['frog', 8], ['abyss', 5], ['diamond', 2]] },

  // ——— Легенды ———
  { id: 'legend', name: 'Легенды', e: '🏆', cost: 12000, cat: 'legend',
    items: [['dragon', 32], ['titan', 26], ['nova', 18], ['frog', 12], ['unicorn', 7], ['abyss', 5]] },
  { id: 'absolute', name: 'Абсолют', e: '🌌', cost: 25000, cat: 'legend',
    items: [['titan', 30], ['nova', 28], ['frog', 20], ['abyss', 15], ['dragon', 7]] }
];
const QS = [
  { id: 'g', t: 'Сыграй 5 игр', n: 5, r: 3 },
  { id: 't', t: 'Оборот на 30' + STAR, n: 30, r: 5 },
  { id: 'w', t: 'Выиграй 3 раза', n: 3, r: 4 },
  { id: 'c', t: 'Открой любой кейс', n: 1, r: 2 },
  { id: 'subscribe', t: 'Подпишись на @DabUP_chan', n: 1, r: 100 }
];

// Баланс и список использованных промокодов привязаны к Telegram ID.
// Они остаются в localStorage при замене index.html на том же домене/устройстве.
const balanceStorageKey = 'dabup:balance:' + accountStorageId;
const savedAccountBalance = store.get(balanceStorageKey, null);
const legacyBalance = store.get('bal', START_BALANCE);
let bal = savedAccountBalance === null ? legacyBalance : savedAccountBalance, pref = 5, bet = 0, busy = false, hook = null, shown = bal;
if (savedAccountBalance === null) { store.set(balanceStorageKey, bal); try { localStorage.removeItem('bal'); } catch (e) {} }
const P = Object.assign({ turn: 0, games: 0, wins: 0, best: 0, xp: 0, lvl: 1, inv: [], q: { d: '', p: {}, c: {} }, earn: { confirmed: false, streak: 0, lastClaim: '', rubBalance: 0 } }, store.get('P', {}));
P.earn = Object.assign({ confirmed: false, streak: 0, lastClaim: '', rubBalance: 0 }, P.earn || {});
const save = () => store.set('P', P);

/* ---------- баланс, опыт, задания ---------- */
function setBal(v) { bal = Math.max(0, Math.round(v)); store.set(balanceStorageKey, bal); tween(); checkBet(); }
function tween() {
  const el = $('#bal'), a = shown, b = bal, t0 = performance.now();
  const f = t => { const k = Math.min(1, (t - t0) / 500); shown = Math.round(a + (b - a) * k); el.textContent = fmt(shown); if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
const lvlOf = x => Math.floor(Math.sqrt(x / 20)) + 1, xpAt = l => 20 * (l - 1) * (l - 1);
function addXp(n) {
  P.xp += n; const nl = lvlOf(P.xp);
  if (nl > P.lvl) {
    let r = 0; for (let l = P.lvl + 1; l <= nl; l++) r += l * 2;
    P.lvl = nl; setBal(bal + r); toast('Уровень ' + nl + '! +' + S(r)); hap('success');
  }
}
function qday() { const d = new Date().toDateString(); if (P.q.d !== d) P.q = { d, p: {}, c: {} }; }
function qadd(id, n = 1) { qday(); P.q.p[id] = (P.q.p[id] || 0) + n; save(); }
function dayKey(d = new Date()) { return [d.getFullYear(), String(d.getMonth()+1).padStart(2,'0'), String(d.getDate()).padStart(2,'0')].join('-'); }
function dayDiff(a, b) { const [ay,am,ad]=a.split('-').map(Number), [by,bm,bd]=b.split('-').map(Number); return Math.round((Date.UTC(by,bm-1,bd)-Date.UTC(ay,am-1,ad))/86400000); }
function earnReward(streak) { return streak >= 7 ? 550 : streak >= 4 ? 300 : 100; }
// re-bind after dayKey exists (for early adminDaily helpers)

function checkBet() { const g = $('#go'); if (g && !busy) g.disabled = bet < 1 || bet > bal; }
function toast(t) {
  const el = $('#toast'); el.innerHTML = t; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}
function msg(t, c) { const m = $('#msg'); m.className = 'msg'; void m.offsetWidth; m.innerHTML = t || ''; m.className = 'msg ' + (c || ''); }
function flash() { const p = $('.panel'); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash'); }
function lock(on) {
  document.querySelectorAll('#bets button,#bets input,#stage .seg button,#stage input,#go').forEach(b => b.disabled = on);
}
function take() {
  if (busy || bet < 1 || bet > bal) return false;
  busy = true; P.turn += bet; P.games++; qadd('g'); qadd('t', bet);
  setBal(bal - bet); addXp(bet); msg(''); lock(true);
  return true;
}
function settle(pay, b) {
  pay = Math.round(pay);
  setBal(bal + pay);
  busy = false; lock(false);
  if (pay > b) { P.wins++; qadd('w'); P.best = Math.max(P.best, pay - b); msg('+' + S(pay - b), 'win'); hap('success'); flash(); }
  else if (pay === b) msg('Ставка возвращена');
  else { msg('−' + S(b - pay), 'lose'); hap('error'); }
  save();
  if (bet > bal) bet = bal;
  renderBet();
}
function renderBet() {
  $('#bets').innerHTML =
    `<div class="bv">Ставка <b>${S(bet)}</b></div>
     <div class="chips">` +
    [1, 5, 10, 25, 50, 100].map(v => `<button data-v="${v}" class="${bet === v ? 'on' : ''}">${v}</button>`).join('') +
    `<button data-v="all">Все</button></div>
     <div class="admin-row" style="margin-top:10px">
       <input id="custom-bet" type="number" min="1" max="${bal || 1}" step="1" placeholder="Своя ставка" value="${bet > 0 && ![1,5,10,25,50,100].includes(bet) ? bet : ''}">
       <button id="set-custom-bet" type="button">OK</button>
     </div>`;
  checkBet();
  if (hook) hook();
}
$('#bets').addEventListener('click', e => {
  if (busy) return;
  if (e.target.closest('#set-custom-bet')) {
    const input = $('#custom-bet');
    let v = Number(input && input.value);
    if (!Number.isFinite(v) || v < 1) { toast('Введи ставку ≥ 1'); return; }
    v = Math.min(Math.round(v), bal);
    if (v < 1) { toast('Недостаточно звёзд'); return; }
    pref = v; bet = v;
    renderBet();
    return;
  }
  const b = e.target.closest('button'); if (!b || !b.dataset.v) return;
  if (b.dataset.v === 'all') bet = bal;
  else { pref = +b.dataset.v; bet = Math.min(pref, bal); }
  renderBet();
});
$('#bets').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'custom-bet') $('#set-custom-bet').click();
});

function modal(html, btns) {

    m.classList.remove('on'); const f = btns[+b.dataset.i].f; if (f) f();

}

function drop() {
  let r = Math.random() * DROP_T, i = 0;
  for (; i < DROP_W.length - 1; i++) { r -= DROP_W[i]; if (r < 0) break; }
  return i;
}

/* ---------- экран кейса ---------- */
function caseMount(s, d) {
  const f = !!d.free, its = f ? null : d.items.map(([id, p]) => ({ ...ITEMS[id], id, p }));
  const tier = v => v === 15 ? 3 : v >= 10 ? 2 : v >= 5 ? 1 : 0;
  const pick = () => {
    if (f) { const v = drop(); return { free: true, v, r: tier(v) }; }
    let r = Math.random() * 100; for (const i of its) { r -= i.p; if (r < 0) return i; }
    return its[its.length - 1];
  };
  const cell = it => `<div class="cell r${it.r}">${it.free ? `<b>${it.v}</b>` : art(it)}<small>${it.free ? '' : fmt(it.v)}</small></div>`;
  const bin = (a, b) => DROP_W.slice(a, b + 1).reduce((x, y) => x + y) / DROP_T * 100, pc = p => (+p.toFixed(2)) + '%';
  const odds = f
    ? [[0, 0], [1, 4], [5, 9], [10, 14], [15, 15]].map(([a, b]) => `<div class="oc r${tier(b)}"><b>${a === b ? a : a + '–' + b}${STAR}</b><i>${pc(bin(a, b))}</i></div>`)
    : its.map(i => `<div class="oc r${i.r}">${art(i)}<span>${i.n}${i.nft ? '<em class="pill">NFT</em>' : ''}</span><b>${S(i.v)}</b><i>${pc(i.p)}</i></div>`);
  s.innerHTML = `<div class="cwin"><div class="cmark"></div><div class="cstrip" id="cs"></div></div>
    <button class="go" id="open"></button>
    <h3 class="oh">Что может выпасть</h3><div class="odds">${odds.join('')}</div>`;
  const cs = $('#cs'), btn = $('#open'), win = $('.cwin', s);
  const place = (i, j) => { cs.style.transform = `translateX(${win.offsetWidth / 2 - (i * 76 + 36) + j}px)`; };
  cs.innerHTML = Array.from({ length: 12 }, pick).map(cell).join(''); place(3, 0);
  const refresh = () => {
    const l = f ? caseLeft() : 0;
    btn.disabled = busy || l > 0 || (!f && bal < d.cost);
    btn.innerHTML = f ? (l > 0 ? 'Следующий через ' + leftText(l) : 'Открыть бесплатно') : 'Открыть за ' + S(d.cost);
  };
  refresh();
  btn.onclick = async () => {
    if (btn.disabled) return;
    busy = true; btn.disabled = true; msg('');
    if (!f) { P.turn += d.cost; setBal(bal - d.cost); addXp(d.cost); }
    const w = pick(), arr = Array.from({ length: 40 }, pick); arr[34] = w;
    cs.style.transition = 'none'; cs.innerHTML = arr.map(cell).join(''); place(2, 0);
    cs.getBoundingClientRect();
    cs.style.transition = 'transform 4s cubic-bezier(.12,.6,.1,1)';
    place(34, Math.round(Math.random() * 40 - 20));
    await sleep(4150);
    qadd('c'); busy = false;
    if (f) {
      store.set('caseAt', Date.now()); setBal(bal + w.v);
      msg(w.v ? '+' + S(w.v) : 'Пусто. Приходи завтра', w.v ? 'win' : '');
      if (w.v) { hap('success'); flash(); }
    } else {
      P.inv.push(w.id); save(); hap('success'); flash();
      modal(`<div class="big r${w.r}">${art(w)}</div><h3>${w.n}${w.nft ? '<em class="pill">NFT</em>' : ''}</h3><p>Стоимость ${S(w.v)}</p>`, [
        { t: 'Продать за ' + S(w.v), c: 'ok', f: () => { P.inv.splice(P.inv.lastIndexOf(w.id), 1); save(); setBal(bal + w.v); } },
        { t: 'Оставить в инвентаре' }
      ]);
    }
    refresh();
  };
}

function rCases() {
  const cats = [
    { id: 'change', title: 'На сдачу' },
    { id: 'core', title: 'Основные' },
    { id: 'neon', title: 'Неон' },
    { id: 'night', title: 'Полночь' },
    { id: 'black', title: 'Чёрный рынок' },
    { id: 'legend', title: 'Легенды' }
  ];
  const card = c => {
    const top = c.free ? 15 : Math.max(...c.items.map(i => ITEMS[i[0]].v));
    const l = caseLeft();
    const sub = c.free
      ? (l <= 0 ? 'Можно открыть сейчас, до ' + S(top) : 'Следующий через ' + leftText(l))
      : 'Выпадает до ' + S(top);
    return `<button class="cc case-${c.id}" data-c="${c.id}"><div class="ce">${caseArt(c.id)}</div><div class="ct"><b>${c.name}</b><span>${sub}</span></div><em>${c.free ? 'Бесплатно' : S(c.cost)}</em></button>`;
  };
  let html = `<h1>Кейсы</h1><div class="case-hero"><b>Коллекции DabUP</b><span>Открывай кейсы и собирай предметы. Всё виртуальное, без депозита и вывода.</span></div>`;
  cats.forEach(cat => {
    const list = CASES.filter(c => c.cat === cat.id);
    if (!list.length) return;
    html += `<div class="case-cat">${cat.title}</div>` + list.map(card).join('');
  });
  const rest = CASES.filter(c => !c.cat);
  if (rest.length) html += `<div class="case-cat">Другие</div>` + rest.map(card).join('');
  $('#v-cases').innerHTML = html;
}
function rProfile() {
  qday();
  const l = P.lvl, a = xpAt(l), b = xpAt(l + 1), pc = Math.min(100, (P.xp - a) / (b - a) * 100);
  const name = u ? esc([u.first_name, u.last_name].filter(Boolean).join(' ') || 'Игрок') : 'Игрок';
  const av = u && u.photo_url ? `<img src="${esc(u.photo_url)}" alt="">` : name[0].toUpperCase();
  const inv = P.inv.map((id, i) => `<button class="inv r${ITEMS[id].r}" data-i="${i}">${art(ITEMS[id])}<small>${S(ITEMS[id].v)}</small></button>`).join('') || '<p class="note">Пока пусто. Открой платный кейс.</p>';
  const val = P.inv.reduce((x, id) => x + ITEMS[id].v, 0);
  $('#v-profile').innerHTML = `<div class="pf"><div class="av">${av}</div><div><h1>${name}</h1><span class="lv">Уровень ${l}</span></div></div>
    <div class="xp"><i style="width:${pc}%"></i></div>
    <p class="note">${fmt(P.xp - a)} из ${fmt(b - a)} опыта до уровня ${l + 1}. Опыт растёт с оборотом, за новый уровень дают звёзды.</p>
    <div class="stats">` + [['Оборот', S(P.turn)], ['Игр сыграно', fmt(P.games)], ['Побед', fmt(P.wins)], ['Лучший выигрыш', S(P.best)]].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('') + `</div>
    <h2>Задания на сегодня</h2>` +
    QS.map(q => {
      const p = Math.min(q.n, P.q.p[q.id] || 0), done = p >= q.n;
      const socialLinks = q.id === 'subscribe'
        ? `<div style="display:flex;gap:7px;flex-wrap:wrap;margin-top:8px">
             <a href="https://t.me/dabup_chan" target="_blank" rel="noopener" data-social-open style="display:inline-block;padding:8px 12px;border-radius:10px;background:var(--gold);color:#17120a;font-weight:800;text-decoration:none">Открыть канал ↗</a>
             <span style="color:var(--muted)">Подпишись, затем подтверди выполнение.</span>
           </div>`
        : '';
      const action = q.id === 'subscribe'
        ? (P.q.c[q.id] ? '<em>Получено</em>' : `<button data-social-claim ${P.q.p.socialOpened ? '' : 'disabled'}>Я подписался · +${S(q.r)}</button>`)
        : (P.q.c[q.id] ? '<em>Получено</em>' : `<button data-q="${q.id}" ${done ? '' : 'disabled'}>${done ? 'Забрать ' : ''}+${S(q.r)}</button>`);
      return `<div class="q"><div><b>${q.t}</b>${socialLinks}<div class="xp s"><i style="width:${p / q.n * 100}%"></i></div></div>${action}</div>`;
    }).join('') +
    `<section class="promo-box"><h3>🎟️ Промокод</h3><p>Введи код. Каждый промокод можно активировать один раз на Telegram-аккаунт.</p><div class="promo-row"><input id="promo-code" type="text" maxlength="32" autocomplete="off" placeholder="ВВЕДИ ПРОМОКОД"><button id="promo-claim" type="button">Активировать</button></div></section>` +
    `<h2>Инвентарь <small>${S(val)}</small></h2><div class="invg">${inv}</div>
    <p class="note">1${STAR} = 1 ₽ только как курс для сравнения. Звёзды виртуальные. Это мини-игры без депозита и вывода.</p>` +
    (isAdmin() ? `
      <section class="admin-panel">
        <div class="admin-head"><span>🛠️</span><div><b>Админ-панель (full)</b><small>Доступ: @ezmarad</small></div></div>
        <label class="admin-label" for="admin-stars">Добавить / снять звёзды</label>
        <div class="admin-row">
          <input id="admin-stars" type="number" min="-1000000" max="1000000" step="1" placeholder="± количество">
          <button id="admin-add-stars" type="button">Применить</button>
        </div>
        <label class="admin-label" for="admin-set-bal">Установить точный баланс</label>
        <div class="admin-row">
          <input id="admin-set-bal" type="number" min="0" max="10000000" step="1" placeholder="Новый баланс">
          <button id="admin-set-balance" type="button">Установить</button>
        </div>
        <button class="admin-reset" id="admin-reset-case" type="button">⏱ Сбросить таймер ежедневного кейса</button>
        <button class="admin-reset" id="admin-reset-quests" type="button">📋 Сбросить задания на сегодня</button>
        <button class="admin-reset" id="admin-clear-inv" type="button">🗑️ Очистить инвентарь</button>
        <button class="admin-reset" id="admin-give-item" type="button">🎁 Выдать случайный предмет</button>
        <button class="admin-reset" id="admin-reset-progress" type="button">♻️ Сбросить прогресс (XP/игры/победы)</button>
        <p class="admin-hint">Полный доступ. Изменения только в localStorage этого устройства.</p>
      </section>` : '') +
    (isSysAdmin() ? `
      <section class="admin-panel">
        <div class="admin-head"><span>🛡️</span><div><b>Сис-админ панель</b><small>Доступ: @slizmix · лимит 10 000 ⭐/день, 3 сброса кейса</small></div></div>
        <label class="admin-label" for="sys-stars">Добавить звёзды (лимит ${fmt(getAdminDaily().added)} / 10 000 сегодня)</label>
        <div class="admin-row">
          <input id="sys-stars" type="number" min="1" max="10000" step="1" placeholder="Количество">
          <button id="sys-add-stars" type="button">Добавить</button>
        </div>
        <button class="admin-reset" id="sys-reset-case" type="button">⏱ Сбросить таймер кейса (${getAdminDaily().resets}/3 сегодня)</button>
        <p class="admin-hint">Лимиты обновляются каждый день. Только localStorage.</p>
      </section>` : '');
}
function rEarn() {
  const e = P.earn;
  const today = dayKey();
  const claimedToday = e.lastClaim === today;
  const nameVerified = hasBotTag();
  const nextStreak = e.lastClaim && dayDiff(e.lastClaim, today) === 1 ? e.streak + 1 : (claimedToday ? e.streak : 1);
  const reward = earnReward(nextStreak);
  const status = !nameVerified
    ? 'Добавь @DabUP_robot именно в поле «Имя» или «Фамилия» Telegram. После изменения полностью закрой DabUP и открой мини-приложение заново — простая перезагрузка страницы не обновляет данные профиля.'
    : claimedToday ? 'Сегодняшняя награда уже получена. Возвращайся завтра.' : `Сегодня можно получить ${fmt(reward)} ₽.`;
  $('#v-earn').innerHTML = `<h1>Заработок</h1>
    <p class="hello">Добавь <b>@DabUP_robot</b> в имя профиля Telegram и получай ежедневные виртуальные награды.</p>
    <div class="panel" style="padding:18px;border-radius:18px;margin:14px 0">
      <div style="font-size:13px;color:var(--muted);font-weight:800">ТВОЙ БАЛАНС В ЗАРАБОТКЕ</div>
      <div style="font:800 30px Unbounded,sans-serif;margin:8px 0">${fmt(e.rubBalance)} ₽</div>
      <div style="color:var(--muted);font-size:13px">Серия: ${fmt(e.streak)} ${e.streak === 1 ? 'день' : 'дней'}</div>
    </div>
    <div class="q" style="display:block">
      <b>📝 Добавить @DabUP_robot в имя профиля</b>
      <p class="note">Открой Telegram, измени имя профиля и добавь туда @DabUP_robot.</p>
      <a href="https://t.me/dabup_robot" target="_blank" rel="noopener" style="display:inline-block;padding:9px 13px;border-radius:12px;background:var(--gold);color:var(--dark);font-weight:800;text-decoration:none;margin:4px 0 10px">Открыть @DabUP_robot ↗</a>
      <div><button id="earn-confirm" ${nameVerified ? 'disabled' : ''}>${nameVerified ? 'Имя проверено ✓' : 'Проверить имя Telegram'}</button> <button id="earn-refresh" type="button">Обновить данные ↻</button></div>
      <p class="note" style="margin-top:8px">${esc(telegramNameDebug())}</p>
    </div>
    <div class="q" style="display:block">
      <b>🎁 Ежедневная награда</b>
      <p class="note">1–3-й день — 100 ₽ · 4–6-й день — 300 ₽ · с 7-го дня — 550 ₽</p>
      <p class="note">${status}</p>
      <button id="earn-claim" ${!nameVerified || claimedToday ? 'disabled' : ''}>${claimedToday ? 'Уже получено сегодня' : `Получить ${fmt(reward)} ₽`}</button>
    </div>
    <p class="note">Проверяется наличие @DabUP_robot в имени или фамилии Telegram. Награды — виртуальные баллы внутри DabUP, не реальные деньги.</p>`;
}
function tab(n) {
  cur = n;
  ['games', 'cases', 'earn', 'profile'].forEach(k => $('#v-' + k).hidden = k !== n);
  $('#game').hidden = true; $('#tabs').hidden = false;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === n));
  ({ games: rGames, cases: rCases, earn: rEarn, profile: rProfile })[n]();
  const v = $('#v-' + n); v.classList.remove('view'); void v.offsetWidth; v.classList.add('view');
  if (tg) tg.BackButton.hide();
}
function openView(title, mount, nobet) {
  $('#tabs').hidden = true;
  ['games', 'cases', 'earn', 'profile'].forEach(k => $('#v-' + k).hidden = true);
  const g = $('#game'); g.hidden = false; g.classList.remove('view'); void g.offsetWidth; g.classList.add('view');
  $('#gtitle').textContent = title; msg('');
  bet = Math.min(pref, bal); hook = null; $('#bets').hidden = !!nobet;
  mount($('#stage'));
  if (!nobet) { renderBet(); if (bal < 1) msg('Нет звёзд. Открой ежедневный кейс'); }
  if (tg) tg.BackButton.show();
}
const openGame = id => { const g = games[id]; openView(g.name, g.mount, false); };
const openCase = id => { const d = CASES.find(c => c.id === id); openView(d.name, s => caseMount(s, d), true); };
function back() { if (busy) return; hook = null; $('#stage').innerHTML = ''; tab(cur); }

function claim(id) {
  const q = QS.find(x => x.id === id); qday();
  if ((P.q.p[id] || 0) < q.n || P.q.c[id]) return;
  P.q.c[id] = 1; save(); setBal(bal + q.r); hap('success'); toast('+' + S(q.r)); rProfile();
}
function invModal(i) {
  const it = ITEMS[P.inv[i]]; if (!it) return;
  modal(`<div class="big r${it.r}">${art(it)}</div><h3>${it.n}${it.nft ? '<em class="pill">NFT</em>' : ''}</h3><p>Стоимость ${S(it.v)}</p>`, [
    { t: 'Продать за ' + S(it.v), c: 'ok', f: () => { P.inv.splice(i, 1); save(); setBal(bal + it.v); hap('success'); rProfile(); } },
    { t: 'Закрыть' }
  ]);
}
$('#views').addEventListener('click', e => {
  const t = e.target.closest('[data-id],[data-c],[data-q],[data-i]'); if (!t) return;
  const d = t.dataset;
  if (d.id) openGame(d.id); else if (d.c) openCase(d.c); else if (d.q) claim(d.q); else if (d.i !== undefined) invModal(+d.i);
});
$('#v-profile').addEventListener('click', e => {
  if (e.target.closest('#promo-claim')) {
    const input = $('#promo-code');
    const code = String(input && input.value || '').trim().replace(/\s+/g, '').toUpperCase();
    if (!u || !u.id) { toast('Открой DabUP через Telegram'); return; }
    if (!code || !Object.prototype.hasOwnProperty.call(PROMOS, code)) { toast('Промокод не найден'); return; }
    if (isPromoClaimed(code)) { toast('Этот промокод уже активирован (скрытый КД ~200 лет)'); return; }
    const reward = PROMOS[code];
    markPromoClaimed(code);
    setBal(bal + reward);
    if (input) input.value = '';
    hap('success'); toast('Промокод активирован: +' + S(reward)); rProfile();
    return;
  }
  if (e.target.closest('[data-social-open]')) {
    qday();
    P.q.p.socialOpened = 1;
    save();
    setTimeout(rProfile, 0);
    return;
  }
  if (e.target.closest('[data-social-claim]')) {
    qday();
    if (P.q.c.subscribe) return;
    if (!P.q.p.socialOpened) { toast('Сначала открой канал'); return; }
    P.q.p.subscribe = 1;
    P.q.c.subscribe = 1;
    save(); setBal(bal + 100); hap('success'); toast('+' + S(100)); rProfile();
    return;
  }
  // Full admin (@ezmarad)
  if (isAdmin()) {
    if (e.target.closest('#admin-add-stars')) {
      const input = $('#admin-stars');
      const amount = Number(input && input.value);
      if (!Number.isSafeInteger(amount) || amount === 0 || Math.abs(amount) > 1000000) {
        toast('Введи целое число от −1 000 000 до 1 000 000');
        return;
      }
      setBal(bal + amount);
      if (input) input.value = '';
      toast((amount > 0 ? 'Добавлено ' : 'Снято ') + S(Math.abs(amount)));
      rProfile();
      return;
    }
    if (e.target.closest('#admin-set-balance')) {
      const input = $('#admin-set-bal');
      const val = Number(input && input.value);
      if (!Number.isSafeInteger(val) || val < 0 || val > 10000000) {
        toast('Введи число от 0 до 10 000 000');
        return;
      }
      setBal(val);
      if (input) input.value = '';
      toast('Баланс установлен: ' + S(val));
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-case')) {
      store.set('caseAt', 0);
      toast('Таймер ежедневного кейса сброшен');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-quests')) {
      qday();
      P.q = { d: P.q.d, p: {}, c: {} };
      save();
      toast('Задания на сегодня сброшены');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-clear-inv')) {
      P.inv = [];
      save();
      toast('Инвентарь очищен');
      rProfile();
      return;
    }
    if (e.target.closest('#admin-give-item')) {
      const ids = Object.keys(ITEMS);
      const id = ids[Math.floor(Math.random() * ids.length)];
      P.inv.push(id);
      save();
      toast('Выдан предмет: ' + ITEMS[id].n);
      rProfile();
      return;
    }
    if (e.target.closest('#admin-reset-progress')) {
      P.turn = 0; P.games = 0; P.wins = 0; P.best = 0; P.xp = 0; P.lvl = 1;
      save();
      toast('Прогресс (XP/игры/победы) сброшен');
      rProfile();
      return;
    }
  }
  // Sys-admin (@slizmix)
  if (isSysAdmin()) {
    if (e.target.closest('#sys-add-stars')) {
      const input = $('#sys-stars');
      const amount = Number(input && input.value);
      const daily = getAdminDaily();
      const role = getAdminRole();
      if (!Number.isSafeInteger(amount) || amount < 1 || amount > role.maxAddDaily) {
        toast('Введи число от 1 до ' + role.maxAddDaily);
        return;
      }
      if (daily.added + amount > role.maxAddDaily) {
        toast('Лимит на сегодня: осталось ' + (role.maxAddDaily - daily.added));
        return;
      }
      daily.added += amount;
      setAdminDaily(daily);
      setBal(bal + amount);
      if (input) input.value = '';
      toast('Добавлено ' + S(amount) + ' (сегодня ' + daily.added + '/' + role.maxAddDaily + ')');
      rProfile();
      return;
    }
    if (e.target.closest('#sys-reset-case')) {
      const daily = getAdminDaily();
      const role = getAdminRole();
      if (daily.resets >= role.maxResetsDaily) {
        toast('Лимит сбросов кейса на сегодня исчерпан (3/3)');
        return;
      }
      daily.resets += 1;
      setAdminDaily(daily);
      store.set('caseAt', 0);
      toast('Таймер кейса сброшен (' + daily.resets + '/' + role.maxResetsDaily + ')');
      rProfile();
      return;
    }
  }
});
$('#v-earn').addEventListener('click', e => {
  const earn = P.earn;
  if (e.target.closest('#earn-refresh')) {
    toast('Закрываю DabUP. Открой мини-приложение заново для обновления профиля.');
    setTimeout(() => { if (tg && tg.close) tg.close(); else location.reload(); }, 900);
    return;
  }
  if (e.target.closest('#earn-confirm')) {
    if (!hasBotTag()) { toast('Не найдено. ' + telegramNameDebug()); return; }
    earn.confirmed = true; save(); toast('Имя Telegram проверено ✓'); rEarn(); return;
  }
  if (e.target.closest('#earn-claim')) {
    const today = dayKey();
    if (!hasBotTag() || earn.lastClaim === today) { if (!hasBotTag()) toast('Не найдено. ' + telegramNameDebug()); return; }
    earn.streak = earn.lastClaim && dayDiff(earn.lastClaim, today) === 1 ? earn.streak + 1 : 1;
    const reward = earnReward(earn.streak);
    earn.rubBalance += reward;
    earn.lastClaim = today;
    save(); hap('success'); toast('+' + fmt(reward) + ' ₽'); rEarn();
  }
});
$('#v-profile').addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target && e.target.id === 'promo-code') $('#promo-claim').click();
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) tab(b.dataset.t); });
$('#back').onclick = back;
if (tg) tg.BackButton.onClick(back);
$('#bal').textContent = fmt(bal);
tab('games');
</script>
</body>
</html>
