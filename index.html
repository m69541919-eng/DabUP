<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>DabUP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Unbounded:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=4">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>

<svg style="position:absolute;width:0;height:0" aria-hidden="true"><defs><linearGradient id="sg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE98A"/><stop offset="1" stop-color="#F29A12"/></linearGradient></defs><symbol id="star" viewBox="0 0 24 24"><path d="M12 1.8l3.1 6.6 7.2.9-5.3 5 1.4 7.2L12 17.9l-6.4 3.6L7 14.3 1.7 9.3l7.2-.9z" fill="url(#sg)" stroke="#C47F08" stroke-width="1" stroke-linejoin="round"/></symbol></svg>

<header class="top">
  <div class="logo">DabUP</div>
  <div class="bal"><svg class="st" width="22" height="22"><use href="#star"/></svg><b id="bal">0</b></div>
</header>

<main id="views">
  <section class="view" id="v-games"></section>
  <section class="view" id="v-cases" hidden></section>
  <section class="view" id="v-profile" hidden></section>
</main>

<section id="game" class="view" hidden>
  <div class="gbar"><button id="back">‹ Назад</button><h2 id="gtitle"></h2></div>
  <div class="panel">
    <div id="stage"></div>
    <div class="msg" id="msg"></div>
  </div>
  <div id="bets"></div>
</section>

<nav class="tabs" id="tabs">
  <button data-t="games" class="on">🎮<span>Игры</span></button>
  <button data-t="cases">📦<span>Кейсы</span></button>
  <button data-t="profile">👤<span>Профиль</span></button>
</nav>
<div id="modal"></div>
<div id="toast"></div>

<script>
const tg = window.Telegram && Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('#15102B'); tg.setBackgroundColor('#15102B'); } catch (e) {} }
const $ = (s, r = document) => r.querySelector(s);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => n.toLocaleString('ru-RU');
const hap = t => { try { tg.HapticFeedback.notificationOccurred(t); } catch (e) {} };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
};
const STAR = '<svg class="st" width="16" height="16" viewBox="0 0 24 24"><use href="#star"/></svg>', S = n => fmt(n) + STAR;
const u = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
const ADMIN_USERNAME = 'ezmarad';
const isAdmin = () => !!(u && (u.username || '').toLowerCase() === ADMIN_USERNAME);

/* ---------- настройки ---------- */
const START_BALANCE = 0;
const CASE_COOLDOWN = 24 * 3600 * 1000;
// вес выпадения 0..15 звёзд из бесплатного кейса; 15 — около 0.1%
const DROP_W = [20, 18, 15, 12, 9, 7, 5, 4, 3, 2.5, 2, 1.5, 1, .7, .4, .1];
const DROP_T = DROP_W.reduce((a, b) => a + b);
const UP_EDGE = 95;

// Предметы. Хочешь свою картинку — положи файл в assets/ и добавь img:'assets/bear.png'
// r — редкость 0..4, v — цена в звёздах (продажа 1 к 1)
const ITEMS = {
  candy: { n: 'Леденец', e: '🍬', v: 5, r: 0 }, heart: { n: 'Сердце', e: '❤️', v: 15, r: 0 },
  bear: { n: 'Мишка', e: '🧸', v: 30, r: 1 }, cake: { n: 'Торт', e: '🎂', v: 50, r: 1 },
  rose: { n: 'Роза', e: '🌹', v: 100, r: 2 }, cup: { n: 'Кубок', e: '🏆', v: 150, r: 2 },
  ring: { n: 'Кольцо', e: '💍', v: 300, r: 2 }, crown: { n: 'Корона', e: '👑', v: 600, r: 3 },
  diamond: { n: 'Алмаз', e: '💎', v: 1500, r: 3 },
  unicorn: { n: 'Единорог', e: '🦄', v: 5000, r: 4, nft: 1 },
  frog: { n: 'Золотая лягушка', e: '🐸', v: 25000, r: 4, nft: 1 }
};
// Кейсы: [предмет, шанс %]. Сумма шансов = 100
const CASES = [
  { id: 'free', name: 'Ежедневный кейс', e: '📦', free: true },
  { id: 'bear', name: 'Мишкин кейс', e: '🧸', cost: 20, items: [['candy', 48.3], ['heart', 28], ['bear', 15], ['cake', 6.5], ['rose', 2], ['diamond', .2]] },
  { id: 'prem', name: 'Премиум кейс', e: '🎁', cost: 100, items: [['bear', 38], ['cake', 30], ['rose', 17], ['cup', 9], ['ring', 4], ['crown', 1.5], ['diamond', .4], ['unicorn', .1]] },
  { id: 'nft', name: 'NFT кейс', e: '💠', cost: 500, items: [['cup', 50], ['ring', 30], ['crown', 13.5], ['diamond', 4.8], ['unicorn', 1.5], ['frog', .2]] }
];
const QS = [
  { id: 'g', t: 'Сыграй 5 игр', n: 5, r: 3 },
  { id: 't', t: 'Оборот на 30' + STAR, n: 30, r: 5 },
  { id: 'w', t: 'Выиграй 3 раза', n: 3, r: 4 },
  { id: 'c', t: 'Открой любой кейс', n: 1, r: 2 }
];

let bal = store.get('bal', START_BALANCE), pref = 5, bet = 0, busy = false, hook = null, shown = bal;
const P = Object.assign({ turn: 0, games: 0, wins: 0, best: 0, xp: 0, lvl: 1, inv: [], q: { d: '', p: {}, c: {} } }, store.get('P', {}));
const save = () => store.set('P', P);

/* ---------- баланс, опыт, задания ---------- */
function setBal(v) { bal = Math.max(0, Math.round(v)); store.set('bal', bal); tween(); checkBet(); }
function tween() {
  const el = $('#bal'), a = shown, b = bal, t0 = performance.now();
  const f = t => { const k = Math.min(1, (t - t0) / 500); shown = Math.round(a + (b - a) * k); el.textContent = fmt(shown); if (k < 1) requestAnimationFrame(f); };
  requestAnimationFrame(f);
}
const lvlOf = x => Math.floor(Math.sqrt(x / 20)) + 1, xpAt = l => 20 * (l - 1) * (l - 1);
function addXp(n) {
  P.xp += n; const nl = lvlOf(P.xp);
  if (nl > P.lvl) {
    let r = 0; for (let l = P.lvl + 1; l <= nl; l++) r += l * 2;
    P.lvl = nl; setBal(bal + r); toast('Уровень ' + nl + '! +' + S(r)); hap('success');
  }
}
function qday() { const d = new Date().toDateString(); if (P.q.d !== d) P.q = { d, p: {}, c: {} }; }
function qadd(id, n = 1) { qday(); P.q.p[id] = (P.q.p[id] || 0) + n; save(); }

function checkBet() { const g = $('#go'); if (g && !busy) g.disabled = bet < 1 || bet > bal; }
function toast(t) {
  const el = $('#toast'); el.innerHTML = t; el.classList.add('show');
  setTimeout(() => el.classList.remove('show'), 2000);
}
function msg(t, c) { const m = $('#msg'); m.className = 'msg'; void m.offsetWidth; m.innerHTML = t || ''; m.className = 'msg ' + (c || ''); }
function flash() { const p = $('.panel'); p.classList.remove('flash'); void p.offsetWidth; p.classList.add('flash'); }
function lock(on) {
  document.querySelectorAll('#bets button,#stage .seg button,#stage input,#go').forEach(b => b.disabled = on);
}
function take() {
  if (busy || bet < 1 || bet > bal) return false;
  busy = true; P.turn += bet; P.games++; qadd('g'); qadd('t', bet);
  setBal(bal - bet); addXp(bet); msg(''); lock(true);
  return true;
}
function settle(pay, b) {
  pay = Math.round(pay);
  setBal(bal + pay);
  busy = false; lock(false);
  if (pay > b) { P.wins++; qadd('w'); P.best = Math.max(P.best, pay - b); msg('+' + S(pay - b), 'win'); hap('success'); flash(); }
  else if (pay === b) msg('Ставка возвращена');
  else { msg('−' + S(b - pay), 'lose'); hap('error'); }
  save();
  if (bet > bal) bet = bal;
  renderBet();
}
function renderBet() {
  $('#bets').innerHTML =
    `<div class="bv">Ставка <b>${S(bet)}</b></div><div class="chips">` +
    [1, 5, 10, 50].map(v => `<button data-v="${v}" class="${bet === v ? 'on' : ''}">${v}</button>`).join('') +
    `<button data-v="all">Все</button></div>`;
  checkBet();
  if (hook) hook();
}
$('#bets').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b || busy) return;
  if (b.dataset.v === 'all') bet = bal;
  else { pref = +b.dataset.v; bet = Math.min(pref, bal); }
  renderBet();
});

function modal(html, btns) {
  const m = $('#modal');
  m.innerHTML = `<div class="mb">${html}<div class="mbtn">${btns.map((b, i) => `<button data-i="${i}" class="${b.c || ''}">${b.t}</button>`).join('')}</div></div>`;
  m.classList.add('on');
  m.onclick = e => {
    const b = e.target.closest('button'); if (!b) return;
    m.classList.remove('on'); const f = btns[+b.dataset.i].f; if (f) f();
  };
}
const art = it => it.img
  ? `<img src="${it.img}" alt="" onerror="this.outerHTML='<span>${it.e}</span>'">`
  : `<span>${it.e}</span>`;

/* ---------- ежедневный кейс ---------- */
function drop() {
  let r = Math.random() * DROP_T, i = 0;
  for (; i < DROP_W.length - 1; i++) { r -= DROP_W[i]; if (r < 0) break; }
  return i;
}
const caseLeft = () => CASE_COOLDOWN - (Date.now() - store.get('caseAt', 0));
const leftText = ms => ms >= 36e5 ? Math.ceil(ms / 36e5) + ' ч' : Math.ceil(ms / 6e4) + ' мин';

/* ---------- игры ---------- */
const games = {
  coin: {
    name: 'Монетка', glyph: '🪙', desc: 'Орёл или решка', cls: 't-coin',
    mount(s) {
      let pick = 'h';
      s.innerHTML = `<div class="coin" id="coin">О</div>
        <div class="seg"><button class="on" data-v="h">Орёл</button><button data-v="t">Решка</button></div>
        <button class="go" id="go">Бросить</button>`;
      s.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
        pick = b.dataset.v;
        s.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
      });
      $('#go').onclick = async () => {
        const b = bet; if (!take()) return;
        const c = $('#coin'), win = Math.random() < .5;
        const res = win ? pick : (pick === 'h' ? 't' : 'h');
        c.classList.add('spin'); await sleep(900); c.classList.remove('spin');
        c.textContent = res === 'h' ? 'О' : 'Р';
        settle(win ? b * 1.95 : 0, b);
      };
    }
  },

  dice: {
    name: 'Кости', glyph: '🎲', desc: 'Выбери шанс сам', cls: 't-dice',
    mount(s) {
      let t = 50, over = true;
      s.innerHTML = `<div class="roll" id="roll">—</div>
        <div class="track"><input type="range" id="rng" min="5" max="95" value="50"></div>
        <div class="seg"><button data-v="u">Меньше</button><button class="on" data-v="o">Больше</button></div>
        <div class="info" id="inf"></div>
        <button class="go" id="go">Бросить</button>`;
      const upd = () => {
        const ch = over ? 100 - t : t, m = 98 / ch;
        $('#inf').innerHTML = `Выпадет ${over ? 'больше' : 'меньше'} <b>${t}</b><br>Шанс <b>${ch}%</b>, выплата <b>x${m.toFixed(2)}</b>`;
        $('#rng').style.background = over
          ? `linear-gradient(90deg,var(--panel2) ${t}%,var(--green) ${t}%)`
          : `linear-gradient(90deg,var(--green) ${t}%,var(--panel2) ${t}%)`;
        return m;
      };
      $('#rng').oninput = e => { t = +e.target.value; upd(); };
      s.querySelectorAll('.seg button').forEach(b => b.onclick = () => {
        over = b.dataset.v === 'o';
        s.querySelectorAll('.seg button').forEach(x => x.classList.toggle('on', x === b));
        upd();
      });
      upd();
      $('#go').onclick = async () => {
        const b = bet; if (!take()) return;
        const m = upd(), roll = Math.random() * 100, R = $('#roll');
        R.className = 'roll';
        for (let i = 0; i < 10; i++) { R.textContent = (Math.random() * 100).toFixed(2); await sleep(55); }
        R.textContent = roll.toFixed(2);
        const win = over ? roll > t : roll < t;
        R.classList.add(win ? 'win' : 'lose');
        settle(win ? b * m : 0, b);
      };
    }
  },

  slots: {
    name: 'Слоты', glyph: '7️⃣', desc: 'Три в ряд до x30', cls: 't-slots',
    mount(s) {
      const S = ['🍒', '🍋', '🔔', '💎', '7️⃣'], P = { '🍒': 3, '🍋': 5, '🔔': 8, '💎': 15, '7️⃣': 30 };
      s.innerHTML = `<div class="reels"><div>🍒</div><div>🍋</div><div>🔔</div></div>
        <div class="info">Три одинаковых: 🍒 x3, 🍋 x5, 🔔 x8, 💎 x15, 7️⃣ x30<br>Два одинаковых — ставка возвращается</div>
        <button class="go" id="go">Крутить</button>`;
      $('#go').onclick = async () => {
        const b = bet; if (!take()) return;
        const R = [...s.querySelectorAll('.reels div')];
        const out = R.map(() => S[Math.random() * 5 | 0]);
        R.forEach(r => r.classList.add('spin'));
        const iv = setInterval(() => R.forEach(r => { if (r.classList.contains('spin')) r.textContent = S[Math.random() * 5 | 0]; }), 70);
        for (let i = 0; i < 3; i++) { await sleep(i ? 350 : 800); R[i].classList.remove('spin'); R[i].textContent = out[i]; }
        clearInterval(iv);
        let m = 0;
        if (out[0] === out[1] && out[1] === out[2]) m = P[out[0]];
        else if (out[0] === out[1] || out[1] === out[2] || out[0] === out[2]) m = 1;
        settle(b * m, b);
      };
    }
  },

  crash: {
    name: 'Ракета', glyph: '🚀', desc: 'Забери до взрыва', cls: 't-crash',
    mount(s) {
      let run = false, raf = 0, b = 0, cp = 1, t0 = 0, m = 1;
      s.innerHTML = `<div class="rocket" id="rk">🚀</div><div class="mult" id="mu">1.00x</div>
        <div class="info">Множитель растёт, пока ракета не взорвётся.<br>Нажми «Забрать» вовремя.</div>
        <button class="go" id="go">Старт</button>`;
      const mu = $('#mu'), go = $('#go');
      const end = win => {
        run = false; cancelAnimationFrame(raf); go.textContent = 'Старт';
        if (win) { mu.className = 'mult cash'; settle(b * m, b); }
        else {
          m = cp; mu.textContent = cp.toFixed(2) + 'x'; mu.className = 'mult boom';
          $('#rk').textContent = '💥'; settle(0, b);
        }
      };
      const tick = now => {
        m = Math.pow(1.05, (now - t0) / 100);
        if (m >= cp) { end(false); return; }
        mu.textContent = m.toFixed(2) + 'x';
        raf = requestAnimationFrame(tick);
      };
      go.onclick = () => {
        if (run) { m = Math.floor(m * 100) / 100; end(true); return; }
        b = bet; if (!take()) return;
        go.disabled = false;
        cp = Math.min(500, Math.max(1, Math.floor(97 / (1 - Math.random())) / 100));
        mu.className = 'mult run'; mu.textContent = '1.00x'; $('#rk').textContent = '🚀';
        run = true; go.textContent = 'Забрать';
        t0 = performance.now(); raf = requestAnimationFrame(tick);
      };
    }
  },

  upgrade: {
    name: 'Апгрейд', glyph: '⚡', desc: 'Умножь монеты на колесе', cls: 't-up wide',
    mount(s) {
      const M = [1.5, 2, 3, 5, 10]; let mult = 2, rot = 0;
      s.innerHTML = `<div class="wheelwrap"><div class="ptr"></div><div class="wheel" id="wh"></div><div class="wc" id="wc"></div></div>
        <div class="seg" id="ms">${M.map(m => `<button data-v="${m}" class="${m === mult ? 'on' : ''}">x${m}</button>`).join('')}</div>
        <div class="info" id="inf"></div>
        <button class="go" id="go">Прокачать</button>`;
      const chance = () => UP_EDGE / mult;
      const upd = () => {
        const c = chance(), pay = S(Math.round(bet * mult));
        $('#wh').style.background = `conic-gradient(var(--green) 0 ${c * 3.6}deg,var(--panel2) ${c * 3.6}deg 360deg)`;
        $('#wc').innerHTML = `x${mult}<small>${pay}</small>`;
        $('#inf').innerHTML = `Шанс успеха <b>${c.toFixed(1)}%</b><br>Ставка ${S(bet)} станет <b>${pay}</b>, а при неудаче сгорит`;
      };
      hook = upd;
      s.querySelectorAll('#ms button').forEach(b => b.onclick = () => {
        mult = +b.dataset.v;
        s.querySelectorAll('#ms button').forEach(x => x.classList.toggle('on', x === b));
        upd();
      });
      $('#go').onclick = async () => {
        const b = bet; if (!take()) return;
        const c = chance(), deg = c * 3.6, win = Math.random() * 100 < c;
        const tgt = win ? 3 + Math.random() * (deg - 6) : deg + 3 + Math.random() * (354 - deg);
        rot += 360 * 5 + ((((360 - tgt) - (rot % 360)) % 360) + 360) % 360;
        $('#wh').style.transform = `rotate(${rot}deg)`;
        await sleep(3600);
        settle(win ? b * mult : 0, b);
      };
      upd();
    }
  }
};

/* ---------- экран кейса ---------- */
function caseMount(s, d) {
  const f = !!d.free, its = f ? null : d.items.map(([id, p]) => ({ ...ITEMS[id], id, p }));
  const tier = v => v === 15 ? 3 : v >= 10 ? 2 : v >= 5 ? 1 : 0;
  const pick = () => {
    if (f) { const v = drop(); return { free: true, v, r: tier(v) }; }
    let r = Math.random() * 100; for (const i of its) { r -= i.p; if (r < 0) return i; }
    return its[its.length - 1];
  };
  const cell = it => `<div class="cell r${it.r}">${it.free ? `<b>${it.v}</b>` : art(it)}<small>${it.free ? '' : fmt(it.v)}</small></div>`;
  const bin = (a, b) => DROP_W.slice(a, b + 1).reduce((x, y) => x + y) / DROP_T * 100, pc = p => (+p.toFixed(2)) + '%';
  const odds = f
    ? [[0, 0], [1, 4], [5, 9], [10, 14], [15, 15]].map(([a, b]) => `<div class="oc r${tier(b)}"><b>${a === b ? a : a + '–' + b}${STAR}</b><i>${pc(bin(a, b))}</i></div>`)
    : its.map(i => `<div class="oc r${i.r}">${art(i)}<span>${i.n}${i.nft ? '<em class="pill">NFT</em>' : ''}</span><b>${S(i.v)}</b><i>${pc(i.p)}</i></div>`);
  s.innerHTML = `<div class="cwin"><div class="cmark"></div><div class="cstrip" id="cs"></div></div>
    <button class="go" id="open"></button>
    <h3 class="oh">Что может выпасть</h3><div class="odds">${odds.join('')}</div>`;
  const cs = $('#cs'), btn = $('#open'), win = $('.cwin', s);
  const place = (i, j) => { cs.style.transform = `translateX(${win.offsetWidth / 2 - (i * 76 + 36) + j}px)`; };
  cs.innerHTML = Array.from({ length: 12 }, pick).map(cell).join(''); place(3, 0);
  const refresh = () => {
    const l = f ? caseLeft() : 0;
    btn.disabled = busy || l > 0 || (!f && bal < d.cost);
    btn.innerHTML = f ? (l > 0 ? 'Следующий через ' + leftText(l) : 'Открыть бесплатно') : 'Открыть за ' + S(d.cost);
  };
  refresh();
  btn.onclick = async () => {
    if (btn.disabled) return;
    busy = true; btn.disabled = true; msg('');
    if (!f) { P.turn += d.cost; setBal(bal - d.cost); addXp(d.cost); }
    const w = pick(), arr = Array.from({ length: 40 }, pick); arr[34] = w;
    cs.style.transition = 'none'; cs.innerHTML = arr.map(cell).join(''); place(2, 0);
    cs.getBoundingClientRect();
    cs.style.transition = 'transform 4s cubic-bezier(.12,.6,.1,1)';
    place(34, Math.round(Math.random() * 40 - 20));
    await sleep(4150);
    qadd('c'); busy = false;
    if (f) {
      store.set('caseAt', Date.now()); setBal(bal + w.v);
      msg(w.v ? '+' + S(w.v) : 'Пусто. Приходи завтра', w.v ? 'win' : '');
      if (w.v) { hap('success'); flash(); }
    } else {
      P.inv.push(w.id); save(); hap('success'); flash();
      modal(`<div class="big r${w.r}">${art(w)}</div><h3>${w.n}${w.nft ? '<em class="pill">NFT</em>' : ''}</h3><p>Стоимость ${S(w.v)}</p>`, [
        { t: 'Продать за ' + S(w.v), c: 'ok', f: () => { P.inv.splice(P.inv.lastIndexOf(w.id), 1); save(); setBal(bal + w.v); } },
        { t: 'Оставить в инвентаре' }
      ]);
    }
    refresh();
  };
}

/* ---------- вкладки ---------- */
let cur = 'games';
function rGames() {
  const ids = ['coin', 'dice', 'slots', 'crash', 'upgrade'];
  $('#v-games').innerHTML = `<h1>Игры</h1><p class="hello">${u && u.first_name ? 'Привет, ' + esc(u.first_name) + '! ' : ''}Играй на звёзды: 1${STAR} = 1 ₽</p><div class="grid">` +
    ids.map(id => { const g = games[id]; return `<button class="tile ${g.cls}" data-id="${id}"><div class="g">${g.glyph}</div><div><b>${g.name}</b><span>${g.desc}</span></div></button>`; }).join('') +
    `</div><p class="note">DabUP — развлечение на виртуальные звёзды. Реальных денег здесь нет: ничего нельзя пополнить, вывести или обменять.</p>`;
}
function rCases() {
  $('#v-cases').innerHTML = `<h1>Кейсы</h1><p class="hello">Внутри каждого кейса видно, что и с каким шансом выпадает</p>` +
    CASES.map(c => {
      const top = c.free ? 15 : Math.max(...c.items.map(i => ITEMS[i[0]].v)), l = caseLeft();
      const sub = c.free ? (l <= 0 ? 'Можно открыть сейчас, до ' + S(top) : 'Следующий через ' + leftText(l)) : 'Выпадает до ' + S(top);
      return `<button class="cc ${c.free ? 'cfree' : ''}" data-c="${c.id}"><div class="ce">${c.e}</div><div class="ct"><b>${c.name}</b><span>${sub}</span></div><em>${c.free ? 'Бесплатно' : S(c.cost)}</em></button>`;
    }).join('');
}
function rProfile() {
  qday();
  const l = P.lvl, a = xpAt(l), b = xpAt(l + 1), pc = Math.min(100, (P.xp - a) / (b - a) * 100);
  const name = u ? esc([u.first_name, u.last_name].filter(Boolean).join(' ') || 'Игрок') : 'Игрок';
  const av = u && u.photo_url ? `<img src="${esc(u.photo_url)}" alt="">` : name[0].toUpperCase();
  const inv = P.inv.map((id, i) => `<button class="inv r${ITEMS[id].r}" data-i="${i}">${art(ITEMS[id])}<small>${S(ITEMS[id].v)}</small></button>`).join('') || '<p class="note">Пока пусто. Открой платный кейс.</p>';
  const val = P.inv.reduce((x, id) => x + ITEMS[id].v, 0);
  $('#v-profile').innerHTML = `<div class="pf"><div class="av">${av}</div><div><h1>${name}</h1><span class="lv">Уровень ${l}</span></div></div>
    <div class="xp"><i style="width:${pc}%"></i></div>
    <p class="note">${fmt(P.xp - a)} из ${fmt(b - a)} опыта до уровня ${l + 1}. Опыт растёт с оборотом, за новый уровень дают звёзды.</p>
    <div class="stats">` + [['Оборот', S(P.turn)], ['Игр сыграно', fmt(P.games)], ['Побед', fmt(P.wins)], ['Лучший выигрыш', S(P.best)]].map(([k, v]) => `<div><b>${v}</b><span>${k}</span></div>`).join('') + `</div>
    <h2>Задания на сегодня</h2>` +
    QS.map(q => {
      const p = Math.min(q.n, P.q.p[q.id] || 0), done = p >= q.n;
      return `<div class="q"><div><b>${q.t}</b><div class="xp s"><i style="width:${p / q.n * 100}%"></i></div></div>` +
        (P.q.c[q.id] ? '<em>Получено</em>' : `<button data-q="${q.id}" ${done ? '' : 'disabled'}>${done ? 'Забрать ' : ''}+${S(q.r)}</button>`) + `</div>`;
    }).join('') +
    `<h2>Инвентарь <small>${S(val)}</small></h2><div class="invg">${inv}</div>
    <p class="note">1${STAR} = 1 ₽ только как курс для сравнения. Звёзды виртуальные.</p>` +
    (isAdmin() ? `
      <section class="admin-panel">
        <div class="admin-head"><span>🛠️</span><div><b>Админ-панель</b><small>Доступ: @${ADMIN_USERNAME}</small></div></div>
        <label class="admin-label" for="admin-stars">Добавить звёзды</label>
        <div class="admin-row">
          <input id="admin-stars" type="number" min="1" max="1000000" step="1" placeholder="Количество">
          <button id="admin-add-stars" type="button">Добавить</button>
        </div>
        <button class="admin-reset" id="admin-reset-case" type="button">⏱ Сбросить таймер ежедневного кейса</button>
        <p class="admin-hint">Изменения сохраняются в локальном хранилище этого браузера.</p>
      </section>` : '');
}
function tab(n) {
  cur = n;
  ['games', 'cases', 'profile'].forEach(k => $('#v-' + k).hidden = k !== n);
  $('#game').hidden = true; $('#tabs').hidden = false;
  document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === n));
  ({ games: rGames, cases: rCases, profile: rProfile })[n]();
  const v = $('#v-' + n); v.classList.remove('view'); void v.offsetWidth; v.classList.add('view');
  if (tg) tg.BackButton.hide();
}
function openView(title, mount, nobet) {
  $('#tabs').hidden = true;
  ['games', 'cases', 'profile'].forEach(k => $('#v-' + k).hidden = true);
  const g = $('#game'); g.hidden = false; g.classList.remove('view'); void g.offsetWidth; g.classList.add('view');
  $('#gtitle').textContent = title; msg('');
  bet = Math.min(pref, bal); hook = null; $('#bets').hidden = !!nobet;
  mount($('#stage'));
  if (!nobet) { renderBet(); if (bal < 1) msg('Нет звёзд. Открой ежедневный кейс'); }
  if (tg) tg.BackButton.show();
}
const openGame = id => { const g = games[id]; openView(g.name, g.mount, false); };
const openCase = id => { const d = CASES.find(c => c.id === id); openView(d.name, s => caseMount(s, d), true); };
function back() { if (busy) return; hook = null; $('#stage').innerHTML = ''; tab(cur); }

function claim(id) {
  const q = QS.find(x => x.id === id); qday();
  if ((P.q.p[id] || 0) < q.n || P.q.c[id]) return;
  P.q.c[id] = 1; save(); setBal(bal + q.r); hap('success'); toast('+' + S(q.r)); rProfile();
}
function invModal(i) {
  const it = ITEMS[P.inv[i]]; if (!it) return;
  modal(`<div class="big r${it.r}">${art(it)}</div><h3>${it.n}${it.nft ? '<em class="pill">NFT</em>' : ''}</h3><p>Стоимость ${S(it.v)}</p>`, [
    { t: 'Продать за ' + S(it.v), c: 'ok', f: () => { P.inv.splice(i, 1); save(); setBal(bal + it.v); hap('success'); rProfile(); } },
    { t: 'Закрыть' }
  ]);
}
$('#views').addEventListener('click', e => {
  const t = e.target.closest('[data-id],[data-c],[data-q],[data-i]'); if (!t) return;
  const d = t.dataset;
  if (d.id) openGame(d.id); else if (d.c) openCase(d.c); else if (d.q) claim(d.q); else if (d.i !== undefined) invModal(+d.i);
});
$('#v-profile').addEventListener('click', e => {
  if (!isAdmin()) return;
  if (e.target.closest('#admin-add-stars')) {
    const input = $('#admin-stars');
    const amount = Number(input && input.value);
    if (!Number.isSafeInteger(amount) || amount < 1 || amount > 1000000) {
      toast('Введи число от 1 до 1 000 000');
      return;
    }
    setBal(bal + amount);
    if (input) input.value = '';
    toast('Добавлено ' + S(amount));
    rProfile();
  }
  if (e.target.closest('#admin-reset-case')) {
    store.set('caseAt', 0);
    toast('Таймер ежедневного кейса сброшен');
    rProfile();
  }
});
$('#tabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) tab(b.dataset.t); });
$('#back').onclick = back;
if (tg) tg.BackButton.onClick(back);
$('#bal').textContent = fmt(bal);
tab('games');
</script>
</body>
</html>
